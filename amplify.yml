version: 1
applications:
  - appRoot: app-web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20
            - npm ci
        build:
          commands:
            # Next no ve las variables de Amplify en runtime: se vuelcan a .env.production.
            # Se escapa $ porque Next expande variables dentro de los .env.
            - env | grep -E '^(DATABASE_URL|SQL_SERVER_URL|SOFTLAND_URL|PORTAL_DB_|SOFTLAND_DB_|SQL_|COMPANIES_CONFIG|DEMO_MODE|READ_ONLY_MODE|SOFTLAND_EXECUTION_BLOCKED|PORTAL_ONLY_MODE)' | sed 's/\$/\\$/g' >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
