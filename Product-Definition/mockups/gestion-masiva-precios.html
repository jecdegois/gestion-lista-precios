<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui; background:#f8f9fb; color:#0a0a0a; }
  .mono { font-family: 'JetBrains Mono', ui-monospace; }

  /* ===================== SISTEMA DE COMBOBOX (CRÍTICO — NO REGRESIÓN) ===================== */
  .combo-parent, .fp, .fp-r1, .fp-r2 { overflow: visible; }
  .combo-w { position: relative; }
  .combo-in {

  .modal-box { background:#fff; border-radius:14px; max-width:980px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:0 25px 50px -12px rgba(0,0,0,.25); animation: modalIn .18s ease-out; }
  @keyframes modalIn { from { opacity:0; transform:translateY(8px) scale(.98); } to { opacity:1; transform:translateY(0) scale(1); } }

  .nav-link { font-size:13px; font-weight:500; padding:8px 14px; border-radius:8px; color:#71717a; cursor:pointer; user-select:none; }
  .nav-link.active { background:#18181b; color:#fff; }
  .nav-link[data-disabled="true"] { opacity:.4; cursor:not-allowed; }
  .row-alert { background:#FEF2F2; }

  .toast { background:#18181b; color:#fff; font-size:13px; padding:11px 14px; border-radius:10px; box-shadow:0 10px 25px -5px rgba(0,0,0,.3); display:flex; align-items:flex-start; gap:8px; opacity:0; transform:translateY(8px); transition:all .25s; }
  .toast.show { opacity:1; transform:translateY(0); }

  .alert-critical { animation: alertIn .3s ease-out; }

  .progress-track { width:100%; height:10px; background:#e4e4e7; border-radius:999px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,#4338CA,#6366F1); border-radius:999px; transition: width .25s linear; }
  .progress-indeterminate { width:40%; animation: progressSlide 1.6s ease-in-out infinite; }
  @keyframes progressSlide { 0% { margin-left: 0%; } 50% { margin-left: 60%; } 100% { margin-left: 0%; } }

  .dropzone { border:1.5px dashed #d4d4d8; border-radius:12px; padding:22px; text-align:center; background:#fafafa; transition: all .15s; cursor:pointer; }
  .dropzone:hover { border-color:#a1a1aa; background:#f4f4f5; }
  .dropzone.drag { border-color:#4338CA; background:#EEF2FF; }
  .s3-tag { font-size:10.5px; color:#a1a1aa; }

  ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:#d4d4d8; border-radius:8px; }
  .avatar { width:28px; height:28px; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; color:#fff; flex:none; }

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* =========================================================================
   ICONOS (estilo Lucide, implementados en línea vía SVG)
   ========================================================================= */
const ICONS = {
  check: "M20 6 9 17l-5-5",
  x: "M18 6 6 18M6 6l12 12",
  chevronDown: "m6 9 6 6 6-6",
  alertTriangle: "M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0ZM12 9v4M12 17h.01",
  loader: "M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83",
  shieldOff: "M19.69 14a6.9 6.9 0 0 0 .31-2V5l-8-3-3.16 1.18M4.73 4.73 4 5v7c0 6 8 10 8 10a20.3 20.3 0 0 0 5.62-4.38M1 1l22 22",
  search: "m21 21-4.34-4.34M18 10.5A7.5 7.5 0 1 1 3 10.5a7.5 7.5 0 0 1 15 0Z",
  eye: "M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z",
  ban: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20ZM4.9 4.9l14.2 14.2",
  fileWarning: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6ZM14 2v6h6M12 12v3M12 18h.01",
  inbox: "M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11Z",
  clock: "M12 6v6l4 2M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0Z",
  upload: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12",
  fileSpreadsheet: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6ZM14 2v6h6M8 13h2M8 17h2M14 13h2M14 17h2",
  download: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3",
  refreshCw: "M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15",
  trash: "M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6h16Z",
  plus: "M12 5v14M5 12h14",
  lock: "M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2ZM7 11V7a5 5 0 0 1 10 0v4M12 15v2",
};

function Icon({ name, className = "w-4 h-4", spin = false }) {
  const d = ICONS[name];
  if (!d) return null;
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
      strokeLinecap="round" strokeLinejoin="round"
      className={className + (spin ? " spin" : "")}>
      <path d={d} />
    </svg>
  );
}

/* =========================================================================
   REGISTRO GLOBAL DE CIERRE DE COMBOBOX (patrón anti-regresión)
   ========================================================================= */
const comboRegistry = new Set();
document.addEventListener("click", function (e) {
  if (e && e.target && e.target.closest && e.target.closest(".combo-w")) return;
  comboRegistry.forEach(function (fn) { fn(); });
});
window.addEventListener("resize", function () { comboRegistry.forEach(function (fn) { fn(); }); });
window.addEventListener("scroll", function () { comboRegistry.forEach(function (fn) { fn(); }); }, true);

function Combobox({ id, value, onChange, options, placeholder, disabled }) {
  // Por ahora, solo el selector de artículos admite búsqueda libre. La opción
  // elegida continúa proviniendo exclusivamente del catálogo mostrado.
  const searchable = id === "codigo-articulo";
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState("");
  const [pos, setPos] = useState({ top: 0, left: 0, width: 0 });
  const triggerRef = useRef(null);

  useEffect(function () {
    const closeFn = function () { setOpen(false); };
    comboRegistry.add(closeFn);
    return function () { comboRegistry.delete(closeFn); };
  }, []);

  function computePosition() {
    const el = triggerRef.current;
    if (!el || !el.getBoundingClientRect) return;
    const rect = el.getBoundingClientRect();
    setPos({ top: rect.bottom + 4, left: rect.left, width: rect.width });
  }

  function handleOpen() {
    if (disabled) return;
    const wasOpen = open;
    comboRegistry.forEach(function (fn) { fn(); });
    if (!wasOpen) {
      if (searchable) setQuery("");
      computePosition();
      setOpen(true);
    }
  }

  function handlePick(ev, opt) {
    if (ev) ev.stopPropagation();
    if (opt.disabled) return;
    if (onChange) onChange(opt);
    setQuery("");
    setOpen(false);
  }

  function normalizar(texto) {
    return String(texto || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  const selected = options.find(function (o) { return o.value === value; });
  const consulta = normalizar(query.trim());
  const opcionesVisibles = !searchable || !consulta
    ? options
    : options.filter(function (opt) { return normalizar(opt.label).indexOf(consulta) !== -1; });
  const valorInput = searchable && open ? query : (selected ? selected.label : "");

  return (
    <div className="combo-w">
      <input
        id={id}
        ref={triggerRef}
        className="combo-in"
        readOnly={!searchable}
        disabled={!!disabled}
        value={valorInput}
        placeholder={placeholder || "Seleccionar..."}
        onFocus={handleOpen}
        onClick={handleOpen}
        onChange={function (ev) {
          if (!searchable) return;
          setQuery(ev.target.value);
          if (!open) {
            computePosition();
            setOpen(true);
          }
        }}
        onKeyDown={function (ev) {
          if (ev.key === "Escape") {
            setQuery("");
            setOpen(false);
          }
        }}
        style={searchable ? { cursor: "text" } : undefined}
      />
      <span className="chev"><Icon name="chevronDown" className="w-3.5 h-3.5" /></span>
      {open && !disabled && (
        <div className="combo-dd" style={{ top: pos.top, left: pos.left, width: pos.width }}>
          {opcionesVisibles.map(function (opt) {
            return (
              <div key={opt.value} className={"combo-opt" + (opt.disabled ? " opacity-40 cursor-not-allowed" : "")}
                title={opt.disabled ? "Fuera de su ámbito autorizado" : undefined}
                onClick={function (ev) { handlePick(ev, opt); }}>
                {opt.icon}
                <span>{opt.label}</span>
                {opt.disabled && <span className="badge badge-outline ml-auto" style={{ fontSize: 9 }}>Sin acceso</span>}
              </div>
            );
          })}
          {opcionesVisibles.length === 0 && (
            <div className="px-3 py-2 text-xs text-zinc-400">No se encontraron artículos por código o nombre.</div>
          )}
        </div>
      )}
    </div>
  );
}

/* =========================================================================
   INFERENCIA AUTOMÁTICA DE COMPAÑÍA (SIMULACIÓN SOFTLAND SECURITY S2/SS)
   El backend real resolvería la compañía del usuario autenticado consultando
   Softland Security (S2/SS) por su identidad corporativa. Aquí se simula esa
   resolución a partir del dominio de correo de la sesión SSO, de forma que
   NINGUNA pantalla ofrezca un selector manual de compañía: el contexto queda
   fijo y aislado para toda la sesión (aislamiento visual de datos por tenant).
   ========================================================================= */
const DOMINIO_A_COMPANIA_S2SS = {
  "sillaca.com": "SILLACA",
  "beval.com": "BEVAL",
  "febeca.com": "FEBECA",
  "cofersa.com": "COFERSA",
};

function resolverCompaniaPorCorreo(email) {
  const dominio = String(email || "").split("@")[1] || "";
  return DOMINIO_A_COMPANIA_S2SS[dominio.toLowerCase()] || null;
}

/* =========================================================================
   DATOS DE SESIÓN SIMULADA (OIDC / SSO — AWS Cognito / Active Directory)
   La compañía NO se declara aquí manualmente: se deriva del dominio de correo
   mediante resolverCompaniaPorCorreo, replicando la resolución S2/SS. Debe
   existir al menos un usuario de ejemplo por compañía para poder demostrar
   el aislamiento de datos entre compañías (multitenant); SILLACA conserva
   además el par Operador/Aprobador para demostrar el flujo Maker-Checker
   dentro de una misma compañía.
   ========================================================================= */
const IDENTITIES = [
  { email: "jperez@sillaca.com", nombre: "Juan Pérez", rol: "OPERADOR", color: "#2563eb" },
  { email: "mrodriguez@sillaca.com", nombre: "María Rodríguez", rol: "APROBADOR", color: "#7c3aed" },
  { email: "palvarado@beval.com", nombre: "Pedro Alvarado", rol: "OPERADOR", color: "#0d9488" },
  { email: "ljimenez@febeca.com", nombre: "Lucía Jiménez", rol: "APROBADOR", color: "#ea580c" },
  { email: "dvargas@cofersa.com", nombre: "Diego Vargas", rol: "OPERADOR", color: "#b45309" },
  { email: "cgomez@sinmapeo.com", nombre: "Carlos Gómez", rol: "SIN_PERMISO", color: "#71717a" },
].map(function (identity) {
  return Object.assign({}, identity, { compania: resolverCompaniaPorCorreo(identity.email) });
});

function initials(nombre) {
  return nombre.split(" ").map(function (p) { return p[0]; }).join("").slice(0, 2).toUpperCase();
}

/* =========================================================================
   PANTALLA DE LOGIN (reemplaza el selector de identidad en el header)
   Presenta un usuario de ejemplo por compañía (más el caso sin acceso) para
   iniciar sesión, simulando la autenticación corporativa (SSO/S2SS) antes de
   entrar a la aplicación. La compañía mostrada en cada tarjeta ya proviene
   de la resolución automática por dominio de correo (resolverCompaniaPorCorreo).
   ========================================================================= */
function LoginScreen({ onLogin }) {
  const [selectedEmail, setSelectedEmail] = useState("");
  const [isLoading, setIsLoading] = useState(false);

  function handleContinue() {
    if (!selectedEmail || isLoading) return;
    setIsLoading(true);
    setTimeout(function () {
      const identity = IDENTITIES.find(function (i) { return i.email === selectedEmail; });
      if (identity) onLogin(identity);
      setIsLoading(false);
    }, 1200);
  }

  const selectedIdentity = IDENTITIES.find(function (i) { return i.email === selectedEmail; });
  const sinAcceso = selectedIdentity && selectedIdentity.rol === "SIN_PERMISO";

  return (
    <div className="min-h-screen flex items-center justify-center px-6 py-10 bg-white">
      <div className="relative w-full max-w-md">
        {/* Header */}
        <div className="text-center mb-10">
          <div className="w-14 h-14 rounded-lg bg-zinc-900 flex items-center justify-center text-white font-bold text-lg mx-auto mb-4 shadow-md">GP</div>
          <h1 className="text-2xl font-bold text-zinc-900 mb-1">Gestión Masiva de Precios</h1>
          <p className="text-zinc-500 text-sm">Sistema de automatización de listas de precio</p>
        </div>

        {/* Tarjeta principal */}
        <div className="card p-8 shadow-lg border border-zinc-100">
          
          {/* Etapa 1: Selección */}
          {!selectedEmail ? (
            <div className="space-y-5">
              <div className="mb-6">
                <h2 className="text-lg font-semibold text-zinc-900 mb-1">Iniciar sesión</h2>
                <p className="text-zinc-500 text-sm">Seleccione su usuario corporativo</p>
              </div>

              <div>
                <label htmlFor="user-select" className="block text-sm font-medium text-zinc-700 mb-3">
                  <Icon name="user" className="w-4 h-4 inline mr-2 text-zinc-600" />
                  Usuario
                </label>
                
                <div className="relative">
                  <select
                    id="user-select"
                    value={selectedEmail}
                    onChange={function (e) { setSelectedEmail(e.target.value); }}
                    className="w-full appearance-none px-4 py-2.5 pr-10 text-sm border border-zinc-300 rounded-lg bg-white text-zinc-900 focus:outline-none focus:border-zinc-900 focus:ring-2 focus:ring-zinc-900/10 transition-all cursor-pointer hover:border-zinc-400">
                    <option value="">-- Seleccione un usuario --</option>
                    {IDENTITIES.map(function (identity) {
                      const sinAcceso = identity.rol === "SIN_PERMISO";
                      return (
                        <option key={identity.email} value={identity.email} disabled={sinAcceso}>
                          {identity.nombre} • {identity.rol} • {identity.compania || "—"}
                        </option>
                      );
                    })}
                  </select>
                  <span className="absolute right-3 top-1/2 transform -translate-y-1/2 pointer-events-none text-zinc-400">
                    <Icon name="chevronDown" className="w-4 h-4" />
                  </span>
                </div>
              </div>

              <div className="rounded-lg bg-zinc-50 border border-zinc-200 p-3 text-xs text-zinc-600 space-y-1">
                <p>👤 {IDENTITIES.filter(function (i) { return i.rol !== "SIN_PERMISO"; }).length} usuario(s) disponible(s)</p>
                <p>🔒 Autenticación corporativa (SSO)</p>
              </div>
            </div>
          ) : (
            /* Etapa 2: Confirmación */
            <div className="space-y-5">
              <div className="mb-6">
                <h2 className="text-lg font-semibold text-zinc-900 mb-1">Confirmación de cuenta</h2>
                <p className="text-zinc-500 text-sm">Verifique sus datos antes de continuar</p>
              </div>

              {/* Tarjeta de usuario */}
              <div className="rounded-lg border border-zinc-300 bg-gradient-to-br from-zinc-50 to-white p-4">
                <div className="flex items-center gap-4 mb-4">
                  <span className="avatar w-12 h-12 text-lg font-semibold" style={{ background: selectedIdentity.color }}>
                    {initials(selectedIdentity.nombre)}
                  </span>
                  <div className="flex-1 min-w-0">
                    <p className="text-zinc-900 font-semibold truncate">{selectedIdentity.nombre}</p>
                    <p className="text-zinc-500 text-sm mono truncate">{selectedIdentity.email}</p>
                  </div>
                </div>
                
                <div className="space-y-2 border-t border-zinc-200 pt-3">
                  <div className="flex justify-between text-sm">
                    <span className="text-zinc-600">Compañía:</span>
                    <span className="text-zinc-900 font-medium">{selectedIdentity.compania || "—"}</span>
                  </div>
                  <div className="flex justify-between text-sm">
                    <span className="text-zinc-600">Rol:</span>

          )}
        </div>

        {/* Footer */}
        <div className="mt-6 text-center space-y-1">
          <p className="text-zinc-500 text-xs">
            🔐 Acceso seguro mediante autenticación corporativa (Softland Security S2/SS)
          </p>

        {/* Indicador de carga */}
        {isLoading && (
          <div className="fixed inset-0 bg-black/30 flex items-center justify-center z-50">

  );
}

/* =========================================================================
   CATÁLOGO DE ARTÍCULOS (fuente de verdad para validar filas de Excel)
   Deliberadamente NO incluye "ART-999" para poder demostrar de forma real
   la regla "código de artículo no existe en el catálogo activo".
   ========================================================================= */
const CATALOGO_ARTICULOS = {
  "ART-231": { descripcion: "Refrigeradora 14 pies", precioActual: 10000, costoReposicion: 7200, categoria: "Electrodomésticos", subcategoria: "Refrigeración", grupo: "Línea Blanca", marca: "Mabe", marcaGrupoCompra: "Línea Blanca", bdf: "BDF-001" },
  "ART-455": { descripcion: "Microondas 1.2 CF", precioActual: 4200, costoReposicion: 2900, categoria: "Electrodomésticos", subcategoria: "Cocción", grupo: "Línea Blanca", marca: "Oster", marcaGrupoCompra: "Línea Blanca", bdf: "BDF-002" },
  "ART-089": { descripcion: "Ventilador de Torre", precioActual: 9800, costoReposicion: 10450, categoria: "Hogar", subcategoria: "Climatización", grupo: "Hogar", marca: "Black+Decker", marcaGrupoCompra: "Pequeños Electrodomésticos", bdf: "BDF-003" },
  "ART-120": { descripcion: "Licuadora 600W", precioActual: 3100, costoReposicion: 3300, categoria: "Electrodomésticos", subcategoria: "Preparación de alimentos", grupo: "Hogar", marca: "Oster", marcaGrupoCompra: "Pequeños Electrodomésticos", bdf: "BDF-002" },
  "ART-344": { descripcion: "Plancha a Vapor", precioActual: 2500, costoReposicion: 1600, categoria: "Hogar", subcategoria: "Cuidado del Hogar", grupo: "Hogar", marca: "Black+Decker", marcaGrupoCompra: "Pequeños Electrodomésticos", bdf: "BDF-003" },
  "ART-104": { descripcion: "Cafetera 12 Tazas", precioActual: 6200, costoReposicion: 4400, categoria: "Electrodomésticos", subcategoria: "Preparación de alimentos", grupo: "Línea Blanca", marca: "Hamilton Beach", marcaGrupoCompra: "Línea Blanca", bdf: "BDF-001" },
};

function fmtMonto(n) {
  if (typeof n !== "number" || isNaN(n)) return String(n);
  return "₡" + n.toLocaleString("es-CR", { maximumFractionDigits: 2 });
}

/* =========================================================================
   MARGEN MÍNIMO Y COSTO MÍNIMO DEL ARTÍCULO (Precio Piso)
   El margen mínimo NUNCA se muestra en pantalla (ni el porcentaje ni el
   monto de margen): es un parámetro interno de negocio usado únicamente
   para derivar el "Costo Mínimo del Artículo" (Precio Piso). La interfaz
   solo expone ese monto final ya traducido a moneda.
   Fórmula: Costo Mínimo = Costo de Reposición / (1 - Margen Mínimo).
   ========================================================================= */
const MARGEN_MINIMO_ARTICULO = 0.20; // 20% — parámetro interno, no se expone en UI.

function calcularCostoMinimoArticulo(articulo) {
  if (!articulo || typeof articulo.costoReposicion !== "number") return null;
  const margen = MARGEN_MINIMO_ARTICULO;
  if (margen <= 0 || margen >= 1) return articulo.costoReposicion;
  return articulo.costoReposicion / (1 - margen);
}

/* Convierte una variación porcentual YA CON SIGNO (positiva = Aumento,
   negativa = Disminución) al multiplicador que usa Softland: +10% → 1.10,
   -10% → 0.90. El signo no lo captura el usuario escribiéndolo: proviene
   siempre de la columna/campo obligatorio "Tipo de Variación" (ver
   calcularVariacion), que traduce Aumento en (+) y Disminución en (-) sin
   alterar esta fórmula matemática base. */
function convertirPorcentajeAFactor(valor) {
  const crudo = String(valor == null ? "" : valor).trim().replace(",", ".");
  const porcentaje = parseFloat(crudo);
  const formatoValido = crudo !== "" && !isNaN(porcentaje) && /^-?\d+(\.\d+)?$/.test(crudo);
  const factor = formatoValido ? 1 + (porcentaje / 100) : null;
  const dentroDeRango = formatoValido && factor > 0 && factor <= 2;
  return {
    valido: dentroDeRango,
    porcentaje: porcentaje,
    factor: factor,
    causa: !formatoValido
      ? "Formato de variación inválido / valor no numérico."
      : "El Factor % debe generar un multiplicador mayor que 0 y menor o igual a 2 (variación entre -100% y 100%).",
  };
}

function textoFactorCalculado(factor) {
  return factor != null && !isNaN(factor) ? factor.toFixed(2) : "—";
}

/* =========================================================================
   TIPO DE VARIACIÓN (Aumento / Disminución) — columna obligatoria que
   reemplaza la captura directa de un signo en el campo Factor %. El usuario
   siempre ingresa una magnitud igual o mayor a cero en "Factor %"; el signo
   aplicado sobre la fórmula (Precio Destino = Precio Base × Factor) lo
   determina exclusivamente este campo: Aumento → (+), Disminución → (-).
   ========================================================================= */
const TIPOS_VARIACION = { AUMENTO: "Aumento", DISMINUCION: "Disminución" };

function signoDeTipoVariacion(tipoVariacion) {
  return tipoVariacion === "DISMINUCION" ? -1 : 1;
}

function tipoVariacionDesdeSigno(valorConSigno) {
  return typeof valorConSigno === "number" && valorConSigno < 0 ? "DISMINUCION" : "AUMENTO";
}

function normalizarTipoVariacion(valor) {
  const crudo = String(valor == null ? "" : valor).trim().toLowerCase();
  if (crudo.indexOf("dismin") === 0 || crudo.indexOf("disminuci") !== -1) return "DISMINUCION";
  if (crudo.indexOf("aumento") === 0 || crudo === "+" || crudo === "increment" || crudo.indexOf("increment") === 0) return "AUMENTO";
  return null;
}

/* Combina la magnitud (siempre >= 0, tal como la captura el usuario) con el
   Tipo de Variación seleccionado para obtener el porcentaje con signo y, a
   partir de él, el factor multiplicador final. La fórmula matemática base
   (factor = 1 + porcentaje/100) permanece intacta; solo cambia el signo
   aplicado antes de evaluarla. */
function calcularVariacion(tipoVariacion, magnitudRaw) {
  const crudo = String(magnitudRaw == null ? "" : magnitudRaw).trim().replace(",", ".");
  const magnitud = parseFloat(crudo);
  const formatoValido = crudo !== "" && !isNaN(magnitud) && /^\d+(\.\d+)?$/.test(crudo);
  const signo = signoDeTipoVariacion(tipoVariacion);
  const porcentajeConSigno = formatoValido ? signo * magnitud : null;
  const conversion = formatoValido ? convertirPorcentajeAFactor(String(porcentajeConSigno)) : null;
  return {
    valido: !!tipoVariacion && !!conversion && conversion.valido,
    magnitud: magnitud,
    porcentaje: porcentajeConSigno,
    factor: conversion ? conversion.factor : null,
    causa: !tipoVariacion
      ? "Debe indicar el Tipo de Variación (Aumento o Disminución)."
      : !formatoValido
        ? "El Factor % debe ser un valor numérico igual o mayor a cero. El signo se define únicamente con Tipo de Variación."
        : (conversion && !conversion.valido ? conversion.causa : null),
  };
}

/* =========================================================================
   MOTOR DE VALIDACIÓN FILA POR FILA (reglas de negocio reales, no simuladas)
   modo "precio": el Excel trae el precio propuesto final.
   modo "factor": las filas ya contienen el factor multiplicador derivado
   de la variación porcentual capturada por el usuario.
   ========================================================================= */
function validarFila(row, modo) {
  const articulo = CATALOGO_ARTICULOS[row.codigo];

  if (!articulo) {
    return {
      valido: false,
      precioActual: null,
      precioPropuesto: null,
      costoMinimo: null,
      causa: "El código de artículo no existe en el catálogo activo.",
    };
  }

  const costoMinimo = calcularCostoMinimoArticulo(articulo);

  const crudo = String(row.valorPropuestoRaw).trim().replace(",", ".");
  const numero = parseFloat(crudo);
  const esNumeroValido = crudo !== "" && !isNaN(numero) && /^-?\d+(\.\d+)?$/.test(crudo);

  if (!esNumeroValido) {
    return {
      valido: false,
      precioActual: articulo.precioActual,
      precioPropuesto: null,
      costoMinimo: costoMinimo,
      causa: "Formato de celda inválido / valor no numérico.",
    };
  }

  if (modo === "factor") {
    if (numero <= 0 || numero > 2) {
      return {
        valido: false,
        precioActual: articulo.precioActual,
        precioPropuesto: Math.round(articulo.precioActual * numero),
        costoMinimo: costoMinimo,
        causa: "El factor aplicado (" + numero + ") está fuera del rango permitido (mayor que 0 y menor o igual a 2).",
      };
    }
  }

  const precioPropuesto = modo === "factor" ? Math.round(articulo.precioActual * numero) : Math.round(numero);

  if (precioPropuesto <= 0) {
    return {
      valido: false,
      precioActual: articulo.precioActual,
      precioPropuesto: precioPropuesto,
      costoMinimo: costoMinimo,
      causa: "El precio propuesto resultante debe ser mayor que cero.",
    };
  }

  /* La validación de piso se realiza contra el Costo Mínimo del Artículo
     (que ya incorpora el margen mínimo interno sobre el costo de reposición),
     nunca contra el porcentaje de margen expuesto en pantalla. */
  if (costoMinimo != null && precioPropuesto < costoMinimo) {
    return {
      valido: false,
      precioActual: articulo.precioActual,
      precioPropuesto: precioPropuesto,
      costoMinimo: costoMinimo,
      causa: "El precio propuesto (" + fmtMonto(precioPropuesto) + ") es menor que el Costo Mínimo del Artículo (" + fmtMonto(costoMinimo) + ").",
    };
  }

  return { valido: true, precioActual: articulo.precioActual, precioPropuesto: precioPropuesto, costoMinimo: costoMinimo, causa: null };
}

function construirFilaCompleta(row, modo) {
  const articulo = CATALOGO_ARTICULOS[row.codigo];
  const validacion = validarFila(row, modo);
  return Object.assign({}, row, {
    descripcion: articulo ? articulo.descripcion : "— Código no encontrado —",
    validacion: validacion,
  });
}

function construirFilaDesdeVariacion(row, modo) {
  if (modo !== "factor") return construirFilaCompleta(row, modo);
  const conversion = calcularVariacion(row.tipoVariacion, row.variacionPorcentaje);
  const filaConFactor = Object.assign({}, row, {
    valorPropuestoRaw: conversion.valido ? textoFactorCalculado(conversion.factor) : "",
  });
  const fila = construirFilaCompleta(filaConFactor, modo);
  if (!conversion.valido && CATALOGO_ARTICULOS[row.codigo]) {
    return Object.assign({}, fila, {
      validacion: {
        valido: false,
        precioActual: CATALOGO_ARTICULOS[row.codigo].precioActual,
        precioPropuesto: null,
        costoMinimo: calcularCostoMinimoArticulo(CATALOGO_ARTICULOS[row.codigo]),
        causa: conversion.causa,
      },
    });
  }
  return fila;
}

    { codigo: "ART-999", tipoVariacion: modo === "factor" ? "AUMENTO" : null, variacionPorcentaje: modo === "factor" ? "5" : null, valorPropuestoRaw: modo === "factor" ? "" : "5000" },

/* Parseo de la plantilla oficial XLSX. El proceso de descuento masivo exige
   Lista de Precio | Código Artículo | Tipo de Variación | Factor %; el
   usuario ya no captura ni el sistema depende de una columna de Índice de
   Fila (el identificador interno de fila es solo la posición en el archivo,
   nunca una columna requerida ni visible). */
function codigoListaDesdeArchivo(valor) {
  const crudo = String(valor == null ? "" : valor).trim().toLowerCase();
  return Object.keys(NOMBRES_LISTA).find(function (codigo) {
    return codigo === crudo || NOMBRES_LISTA[codigo].toLowerCase() === crudo;
  }) || null;
}

function construirFilaDescuentoMasivo(row) {
  const fila = construirFilaDesdeVariacion(row, "factor");
  const listaCodigo = codigoListaDesdeArchivo(row.listaCodigo);
  if (!listaCodigo) {
    return Object.assign({}, fila, {
      listaCodigo: null,
      lista: "—",
      validacion: Object.assign({}, fila.validacion, {
        valido: false,
        causa: "La lista de precio no existe o no tiene un formato válido en la plantilla.",
      }),
    });
  }
  return Object.assign({}, fila, { listaCodigo: listaCodigo, lista: NOMBRES_LISTA[listaCodigo] });
}

function parsearArchivoExcel(file, modo, procesoKey) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onerror = function () { reject(new Error("No fue posible leer el archivo.")); };
    reader.onload = function (e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false });
        const dataRows = rows.slice(1).filter(function (r) { return r && r.length > 0; });
        const esDescuentoMasivo = procesoKey === "DESCUENTO_LISTA_PRECIO";
        const parsed = dataRows.map(function (r, idx) {
          const filaArchivo = esDescuentoMasivo ? {
            fila: idx + 1,
            listaCodigo: r[0] !== undefined ? String(r[0]).trim() : null,
            codigo: r[1] !== undefined ? String(r[1]).trim() : "",
            tipoVariacion: normalizarTipoVariacion(r[2]),
            variacionPorcentaje: r[3] !== undefined ? r[3] : "",
            valorPropuestoRaw: r[3] !== undefined ? r[3] : "",
          } : {
            fila: idx + 1,
            codigo: r[0] !== undefined ? String(r[0]).trim() : "",
            tipoVariacion: normalizarTipoVariacion(r[1]),
            variacionPorcentaje: r[2] !== undefined ? r[2] : "",
            valorPropuestoRaw: r[2] !== undefined ? r[2] : "",
          };
          return esDescuentoMasivo ? construirFilaDescuentoMasivo(filaArchivo) : construirFilaDesdeVariacion(filaArchivo, modo);
        });
        resolve(parsed);
      } catch (err) {
        reject(err);
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

/* Plantilla oficial descargable para la carga masiva de descuento por lista y
   artículo. Ya no incluye una columna de Índice de Fila; en su lugar exige
   la columna obligatoria "Tipo de Variacion" (Aumento/Disminucion), que
   define el signo aplicado sobre el Factor % (siempre una magnitud >= 0)
   antes de evaluar la fórmula Precio Destino = Precio Base × Factor. */
function descargarPlantillaExcel(procesoKey) {
  const esDescuentoMasivo = procesoKey === "DESCUENTO_LISTA_PRECIO";
  const encabezado = esDescuentoMasivo
    ? ["Lista de Precio", "Codigo Articulo", "Tipo de Variacion", "Factor %"]
    : ["Codigo Articulo", "Tipo de Variacion", "Factor %"];
  const filasEjemplo = esDescuentoMasivo
    ? [["MAYOREOB", "ART-231", "Aumento", "10"], ["LPV1", "ART-455", "Disminucion", "5"]]
    : [["ART-231", "Aumento", "10"], ["ART-455", "Disminucion", "10"]];
  const hoja = XLSX.utils.aoa_to_sheet([encabezado].concat(filasEjemplo));
  hoja["!cols"] = esDescuentoMasivo ? [{ wch: 20 }, { wch: 18 }, { wch: 16 }, { wch: 12 }] : [{ wch: 18 }, { wch: 16 }, { wch: 12 }];
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, "Plantilla");
  XLSX.writeFile(libro, "plantilla-" + procesoKey.toLowerCase() + ".xlsx");
}

/* Listas de precio habilitadas por compañía (RF-02/RF-03). SILLACA, BEVAL y
   FEBECA comparten el mismo conjunto de listas comerciales; COFERSA opera
   con las 18 listas LPV. Se combina con listasPermitidas del usuario para
   determinar las opciones visibles en el selector de Lista de Precio. */
const LISTAS_POR_COMPANIA = {
  SILLACA: ["mayoreod", "mayoreob", "lparagua", "grupopico", "larab"],
  BEVAL: ["mayoreod", "mayoreob", "lparagua", "grupopico", "larab"],
  FEBECA: ["mayoreod", "mayoreob", "lparagua", "grupopico", "larab"],
  COFERSA: ["lpv1", "lpv2", "lpv3", "lpv4", "lpv5", "lpv6", "lpv7", "lpv8", "lpv9", "lpv10", "lpv11", "lpv12", "lpv13", "lpv14", "lpv15", "lpv16", "lpv17", "lpv18"],
};
const GRUPOS_ARTICULOS = {
  linea_blanca: { label: "Línea Blanca", articulos: ["ART-231", "ART-455", "ART-104"] },
  hogar: { label: "Hogar", articulos: ["ART-089", "ART-120", "ART-344"] },
};
const FILTROS_ARTICULOS = {
  categoria: ["Electrodomésticos", "Hogar"],
  subcategoria: ["Refrigeración", "Cocción", "Climatización", "Preparación de alimentos", "Cuidado del Hogar"],
  grupo: Object.keys(GRUPOS_ARTICULOS).map(function (codigo) { return GRUPOS_ARTICULOS[codigo].label; }),
  marca: ["Mabe", "Oster", "Black+Decker", "Hamilton Beach"],
  marcaGrupoCompra: ["Línea Blanca", "Pequeños Electrodomésticos", "Hogar"],
  bdf: ["BDF-001", "BDF-002", "BDF-003"],
};
const IMPACTO_POR_LISTA = Object.keys(ARTICULOS_POR_LISTA).reduce(function (acumulado, lista) {
  acumulado[lista] = ARTICULOS_POR_LISTA[lista].length;
  return acumulado;
}, {});

function construirFilasMayoreodMasivo(codigoGrupo, factor, tipoVariacion, magnitud) {
  const grupo = GRUPOS_ARTICULOS[codigoGrupo];
  const articulos = grupo ? grupo.articulos : [];
  return articulos.map(function (codigoArticulo, indice) {
    const fila = construirFilaCompleta({
      fila: indice + 1,
      codigo: codigoArticulo,
      tipoVariacion: tipoVariacion,
      variacionPorcentaje: magnitud,
      valorPropuestoRaw: factor,
    }, "factor");
    return Object.assign({}, fila, {
      lista: LISTA_BASE_OBJETIVO.nombre + " / " + LISTA_BASE_OBJETIVO.nivelPrecio,
      grupoArticulo: codigoGrupo,
    });
  });
}

function construirFilasGestionGlobal(listaCodigo, factor, tipoVariacion, magnitud) {
  const codigosArticulo = ARTICULOS_POR_LISTA[listaCodigo] || Object.keys(CATALOGO_ARTICULOS);
  const nombreLista = NOMBRES_LISTA[listaCodigo] || listaCodigo || "Lista seleccionada";
  return codigosArticulo.map(function (codigoArticulo, indice) {
    const fila = construirFilaCompleta({
      fila: indice + 1,
      codigo: codigoArticulo,
      tipoVariacion: tipoVariacion,
      variacionPorcentaje: magnitud,
      valorPropuestoRaw: factor,
    }, "factor");
    return Object.assign({}, fila, { lista: nombreLista });
  });
}

/* Verifica que la compañía y la lista seleccionadas estén dentro del
   ámbito autorizado del usuario actual. La compañía del usuario ya no se
   captura manualmente: se resolvió una sola vez (S2/SS) al iniciar sesión y
   queda fija en user.compania. El ámbito, por lo tanto, se reduce a validar
   que la compañía consultada sea exactamente la compañía de la sesión y que
   la lista pertenezca al catálogo de esa compañía (aislamiento por tenant,
   tanto en la interfaz como en el envío defensivo equivalente al backend). */
function estaEnAmbito(user, compania, listaCodigo) {
  if (!user || !user.compania) return false;
  if (compania && compania !== user.compania) return false;
  if (listaCodigo && (LISTAS_POR_COMPANIA[user.compania] || []).indexOf(listaCodigo) === -1) return false;
  return true;
}

function nuevoIdSolicitud(seq) { return "SOL-" + (10450 + seq); }

/* ID de procesamiento visible al usuario final. Se evita el prefijo técnico
   "SP" (Stored Procedure); en su lugar se usa "PROC" (procesamiento). */
function nuevoIdProcesoSP() {
  const d = new Date();
  const yyyy = d.getFullYear(), mm = String(d.getMonth() + 1).padStart(2, "0"), dd = String(d.getDate()).padStart(2, "0");
  const rand = Math.floor(1000 + Math.random() * 8999);
  return "#PROC-" + yyyy + mm + dd + "-" + rand;
}

function nombreArchivoS3(prefijo, ext) {
  const d = new Date();
  const ts = d.toISOString().replace(/[-:T.]/g, "").slice(0, 14);
  return prefijo + "-" + ts + "." + ext;
}

/* =========================================================================
   GENERACIÓN DE CSV / EXCEL DE DESCARGA (reporte completo y filas fallidas)
   ========================================================================= */
function filasADataCsv(filas) {
  const header = ["Codigo_Articulo", "Descripcion", "Tipo_Variacion", "Factor_Porcentaje", "Factor_Aplicado", "Precio_Actual", "Precio_Propuesto", "Resultado", "Causa"];
  const lines = filas.map(function (f) {
    const v = f.validacion;
    return [
      f.codigo, f.descripcion, f.tipoVariacion ? TIPOS_VARIACION[f.tipoVariacion] : "", f.variacionPorcentaje != null ? f.variacionPorcentaje : "", f.valorPropuestoRaw,
      v.precioActual != null ? v.precioActual : "",
      v.precioPropuesto != null ? v.precioPropuesto : "",
      v.valido ? "OK" : "ERROR",
      v.causa ? v.causa.replace(/"/g, "'") : "",
    ].map(function (val) { return '"' + String(val).replace(/"/g, "'") + '"'; }).join(",");
  });
  return [header.join(",")].concat(lines).join("\n");
}

function descargarTexto(nombre, contenido, mime) {
  const blob = new Blob([contenido], { type: mime || "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* Exportación real a .xlsx (no CSV) para las filas con error, usando la
   misma librería SheetJS ya cargada para la lectura de plantillas. */
function descargarExcelFilas(nombre, filas) {
  const encabezado = ["Codigo_Articulo", "Descripcion", "Tipo_Variacion", "Factor_Porcentaje", "Factor_Aplicado", "Precio_Anterior", "Precio_Nuevo_Procesado", "Estado", "Causa_Error"];
  const datos = filas.map(function (f) {
    const v = f.validacion;
    return [
      f.codigo, f.descripcion, f.tipoVariacion ? TIPOS_VARIACION[f.tipoVariacion] : "", f.variacionPorcentaje != null ? f.variacionPorcentaje : "", f.valorPropuestoRaw,
      v.precioActual != null ? v.precioActual : "",
      v.precioPropuesto != null ? v.precioPropuesto : "",
      v.valido ? "Exitoso" : "Error",
      v.causa || "",
    ];
  });
  const hoja = XLSX.utils.aoa_to_sheet([encabezado].concat(datos));
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, "Filas con error");
  XLSX.writeFile(libro, nombre);
}

/* =========================================================================
   TABLA DE PREVISUALIZACIÓN — compartida entre Operador y Aprobador
   Columnas: Código Artículo | Lista | Descripción | Precio Actual |
   Tipo de Variación | Factor % | Factor aplicado | Precio Propuesto |
   Costo Mínimo del Artículo | Validación.
   Ya no incluye "Fila Excel" (Índice de Fila) ni el porcentaje/monto de
   margen: el margen mínimo es un parámetro interno que solo se traduce al
   monto final "Costo Mínimo del Artículo" en moneda.
   ========================================================================= */
function TablaPrevisualizacion({ filas, compacta }) {
  const UMBRAL_PAGINACION = 5000;
  const FILAS_POR_PAGINA = 100;
  const [paginaActual, setPaginaActual] = useState(1);
  const conError = filas.filter(function (f) { return !f.validacion.valido; }).length;
  const usaPaginacion = filas.length > UMBRAL_PAGINACION;
  const totalPaginas = usaPaginacion ? Math.ceil(filas.length / FILAS_POR_PAGINA) : 1;
  const paginaSegura = Math.min(paginaActual, totalPaginas);
  const inicio = usaPaginacion ? (paginaSegura - 1) * FILAS_POR_PAGINA : 0;
  const fin = usaPaginacion ? Math.min(inicio + FILAS_POR_PAGINA, filas.length) : filas.length;
  const filasVisibles = usaPaginacion ? filas.slice(inicio, fin) : filas;
  const erroresVisibles = filasVisibles.filter(function (f) { return !f.validacion.valido; });

  useEffect(function () {
    setPaginaActual(1);
  }, [filas]);

  return (
    <div>
      <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
        <p className="text-xs text-zinc-500">
          {filas.length} fila(s) evaluada(s){conError > 0 ? " · " + conError + " con hallazgo" : ""}
          {usaPaginacion ? " · Vista detallada paginada para carga masiva" : ""}
        </p>
        {usaPaginacion && (
          <p className="text-xs text-zinc-500 mono">Mostrando {inicio + 1}–{fin} de {filas.length} registros</p>
        )}
      </div>
      <div className="card overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-zinc-50 text-xs text-zinc-500">
            <tr>
              <th className="text-left font-medium px-3 py-2">Código Artículo</th>
              <th className="text-left font-medium px-3 py-2">Lista de Precio</th>
              <th className="text-left font-medium px-3 py-2">Descripción</th>
              <th className="text-right font-medium px-3 py-2">Precio Actual</th>
              <th className="text-left font-medium px-3 py-2">Tipo de Variación</th>
              <th className="text-right font-medium px-3 py-2">Factor %</th>
              <th className="text-right font-medium px-3 py-2">Factor aplicado</th>
              <th className="text-right font-medium px-3 py-2">Precio Propuesto</th>
              <th className="text-right font-medium px-3 py-2">Costo Mínimo del Artículo</th>
              <th className="text-left font-medium px-3 py-2">Validación</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-zinc-100">
            {filasVisibles.map(function (f) {
              const v = f.validacion;
              return (
                <tr key={f.fila + "-" + f.codigo} className={!v.valido ? "row-alert" : ""}>
                  <td className="px-3 py-2 mono">{f.codigo}</td>
                  <td className="px-3 py-2">{f.lista || "—"}</td>
                  <td className="px-3 py-2">{f.descripcion}</td>
                  <td className="px-3 py-2 text-right mono">{v.precioActual != null ? fmtMonto(v.precioActual) : "—"}</td>
                  <td className="px-3 py-2">
                    {f.tipoVariacion
                      ? <span className={"badge " + (f.tipoVariacion === "DISMINUCION" ? "badge-rechazado" : "badge-ok")}>{TIPOS_VARIACION[f.tipoVariacion]}</span>
                      : "—"}
                  </td>
                  <td className="px-3 py-2 text-right mono">{f.variacionPorcentaje != null && f.variacionPorcentaje !== "" ? f.variacionPorcentaje : "—"}</td>
                  <td className="px-3 py-2 text-right mono">{f.valorPropuestoRaw || "—"}</td>
                  <td className="px-3 py-2 text-right mono">{v.precioPropuesto != null ? fmtMonto(v.precioPropuesto) : "—"}</td>
                  <td className="px-3 py-2 text-right mono">{v.costoMinimo != null ? fmtMonto(v.costoMinimo) : "—"}</td>
                  <td className="px-3 py-2">
                    {v.valido
                      ? <span className="badge badge-ok"><Icon name="check" className="w-3 h-3" /> Válida</span>
                      : <span className="badge badge-costo" title={v.causa}><Icon name="alertTriangle" className="w-3 h-3" /> Con hallazgo</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {usaPaginacion && (
        <div className="mt-3 flex items-center justify-between gap-3 flex-wrap">
          <p className="text-xs text-zinc-500">Página {paginaSegura} de {totalPaginas} · {FILAS_POR_PAGINA} registros por página</p>
          <div className="flex items-center gap-2">
            <button type="button" className="btn btn-outline" disabled={paginaSegura === 1}
              onClick={function () { setPaginaActual(function (p) { return Math.max(1, p - 1); }); }}>
              Anterior
            </button>
            <button type="button" className="btn btn-outline" disabled={paginaSegura === totalPaginas}
              onClick={function () { setPaginaActual(function (p) { return Math.min(totalPaginas, p + 1); }); }}>
              Siguiente
            </button>
          </div>
        </div>
      )}
      {!compacta && conError > 0 && (
        <div className="mt-3 rounded-lg bg-red-50 border border-red-200 px-4 py-3">
          <p className="text-xs font-semibold text-red-800 mb-1.5">
            {usaPaginacion ? "Hallazgos de la página actual:" : "Detalle de hallazgos encontrados en la previsualización:"}
          </p>
          <ul className="text-xs text-red-700 space-y-1">
            {erroresVisibles.map(function (f) {
              return <li key={f.fila}>[{f.codigo}]: {f.validacion.causa}</li>;
            })}
          </ul>
        </div>
      )}
    </div>
  );
}

/* =========================================================================
   ZONA DE CARGA DE ARCHIVO XLSX (simulación de subida a S3)
   ========================================================================= */
function ExcelUploader({ disabled, modo, procesoKey, onParsed, onError }) {
  const [drag, setDrag] = useState(false);
  const [fileName, setFileName] = useState(null);
  const [s3Key, setS3Key] = useState(null);
  const [loading, setLoading] = useState(false);
  const inputRef = useRef(null);

  function procesar(file) {
    if (!file) return;
    const ext = file.name.split(".").pop().toLowerCase();
    if (ext !== "xlsx") {
      onError("Formato no soportado. Suba únicamente la plantilla oficial .xlsx.");
      return;
    }
    setLoading(true);
    setFileName(file.name);
    parsearArchivoExcel(file, modo, procesoKey).then(function (filas) {
      const key = "erp-precios-uploads/" + nombreArchivoS3("carga", ext);
      setS3Key(key);
      setLoading(false);
      onParsed(filas, file.name, key);
    }).catch(function () {
      setLoading(false);
      onError("No fue posible leer el archivo. Verifique que respete el formato de la plantilla oficial.");
    });
  }

  function handleDrop(e) {
    e.preventDefault();
    setDrag(false);
    if (disabled) return;
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    procesar(file);
  }

  return (
    <div>
      <div
        className={"dropzone" + (drag ? " drag" : "") + (disabled ? " opacity-50 pointer-events-none" : "")}
        onDragOver={function (e) { e.preventDefault(); setDrag(true); }}
        onDragLeave={function () { setDrag(false); }}
        onDrop={handleDrop}
        onClick={function () { if (!disabled && inputRef.current) inputRef.current.click(); }}
      >
        <input ref={inputRef} type="file" accept=".xlsx" className="hidden" disabled={disabled}
          onChange={function (e) { procesar(e.target.files && e.target.files[0]); }} />
        <Icon name="upload" className="w-6 h-6 mx-auto mb-2 text-zinc-400" />
        {loading ? (
          <p className="text-sm text-zinc-500 flex items-center justify-center gap-2"><Icon name="loader" className="w-4 h-4" spin /> Leyendo archivo…</p>
        ) : fileName ? (
          <div>
            <p className="text-sm font-medium text-zinc-700 flex items-center justify-center gap-1.5"><Icon name="fileSpreadsheet" className="w-4 h-4" /> {fileName}</p>
            {s3Key && <p className="s3-tag mt-1 mono">s3://erp-precios-uploads/{s3Key.split("/")[1]}</p>}
            <p className="text-xs text-zinc-400 mt-1">Haga clic para reemplazar el archivo.</p>
          </div>
        ) : (
          <div>
            <p className="text-sm font-medium text-zinc-700">Arrastre aquí su plantilla, o haga clic para seleccionarla</p>
            <p className="text-xs text-zinc-400 mt-1">Formato admitido: .xlsx según la plantilla oficial del proceso</p>
          </div>
        )}
      </div>
    </div>
  );
}

/* =========================================================================
   PANTALLA: NUEVA SOLICITUD (OPERADOR) — con soporte de solo-lectura
   "Gestión Global" se captura manualmente por lista y factor. "Actualización
   Masiva de Precios" actualiza exclusivamente la lista base configurada por
   Grupo de Artículos y versión aprobada. "Descuento por Artículo" permite captura
   manual o carga masiva XLSX por lista, artículo y factor. Las cargas son
   variables —incluidas cargas de hasta 12,000 registros— y, al superar 5,000
   filas, se muestran paginadas en la previsualización para no sobrecargar la interfaz.

   Ámbito (RF-02 / RF-03): toda opción de Lista de Precio se filtra según la
   compañía fija de la sesión (user.compania, resuelta por S2/SS) y
   el envío se bloquea de forma defensiva si algún valor quedara fuera de
   ámbito (equivalente a la validación que debe repetir el backend).
   ========================================================================= */
/* Selector obligatorio de Tipo de Variación (Aumento / Disminución). Es un

        return (
          <button key={key} type="button" disabled={disabled}
            className={"subtab" + (activo ? " active" : "")}
            onClick={function () { if (onChange) onChange(key); }}>
            {TIPOS_VARIACION[key]}
          </button>
        );
      })}
    </div>
  );
}

function NuevaSolicitud({ readOnly, currentUser, onSubmit }) {
  const [tab, setTab] = useState("FACTOR_PRECIO");
  const [modalidad, setModalidad] = useState("manual"); // manual | excel
  // La compañía ya no se selecciona manualmente: proviene de forma fija de
  // la sesión resuelta por Softland Security (S2/SS) según el dominio de
  // correo del usuario autenticado (ver resolverCompaniaPorCorreo).
  const compania = currentUser.compania;
  const [nivel, setNivel] = useState("");
  const [codigoArticulo, setCodigoArticulo] = useState("");
  const [grupoArticulo, setGrupoArticulo] = useState("");
  const [nivelLista, setNivelLista] = useState(""); // reservado para edición manual de lista
  // "factor" ahora almacena únicamente la magnitud (siempre >= 0) del
  // Factor %. El signo aplicado sobre la fórmula lo determina exclusivamente
  // "tipoVariacion" (Aumento = +, Disminución = -), columna/campo obligatorio.
  const [tipoVariacion, setTipoVariacion] = useState("AUMENTO");
  const [factor, setFactor] = useState("");
  const [itemsManual, setItemsManual] = useState([]); // artículos o listas agregados uno a uno con "+"
  const [errorItem, setErrorItem] = useState(null);
  const [ack, setAck] = useState(false);
  const [simulado, setSimulado] = useState(false);
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);
  const [filasExcel, setFilasExcel] = useState(null);
  const [archivoNombre, setArchivoNombre] = useState(null);
  const [archivoS3Key, setArchivoS3Key] = useState(null);
  const [errorCarga, setErrorCarga] = useState(null);
  // Filtros de búsqueda de artículos (Categoría/Subcategoría, Grupo, Marca,
  // Marca Grupo Compra, BDF). Aplican sobre el catálogo antes de mostrar las
  // opciones del combobox "Código de Artículo" en Descuento por Artículo.
  const [filtroCategoria, setFiltroCategoria] = useState("");
  const [filtroSubcategoria, setFiltroSubcategoria] = useState("");
  const [filtroGrupo, setFiltroGrupo] = useState("");
  const [filtroMarca, setFiltroMarca] = useState("");
  const [filtroMarcaGrupoCompra, setFiltroMarcaGrupoCompra] = useState("");
  const [filtroBdf, setFiltroBdf] = useState("");

  // Las listas de precio disponibles dependen de la Compañía seleccionada
  // (LISTAS_POR_COMPANIA) y, además, del ámbito autorizado del usuario.
  // La lista de precios depende obligatoriamente de la compañía. Antes de
  // seleccionarla no se expone ningún listado, evitando cruces de catálogos.
  const listasDeCompania = compania ? (LISTAS_POR_COMPANIA[compania] || []) : [];
  const nivelOptsBase = listasDeCompania.map(function (codigo) {
    return { value: codigo, label: NOMBRES_LISTA[codigo] || codigo };
  });
  const nivelOpts = nivelOptsBase.filter(function (o) { return estaEnAmbito(currentUser, null, o.value); });
  // MAYOREOD es la Lista Base y solo se gestiona desde Actualización Masiva
  // de Precios (MAYOREOD_MASIVO); se excluye del selector tanto en Gestión
  // Global como en Descuento por Artículo.
  const nivelOptsSinListaBase = nivelOpts.filter(function (o) { return o.value !== "mayoreod"; });
  const articulosFiltrados = Object.keys(CATALOGO_ARTICULOS).filter(function (cod) {
    const art = CATALOGO_ARTICULOS[cod];
    if (filtroCategoria && art.categoria !== filtroCategoria) return false;
    if (filtroSubcategoria && art.subcategoria !== filtroSubcategoria) return false;
    if (filtroGrupo && art.grupo !== filtroGrupo) return false;
    if (filtroMarca && art.marca !== filtroMarca) return false;
    if (filtroMarcaGrupoCompra && art.marcaGrupoCompra !== filtroMarcaGrupoCompra) return false;
    if (filtroBdf && art.bdf !== filtroBdf) return false;
    return true;
  });
  const articuloOpts = articulosFiltrados.map(function (cod) {
    return { value: cod, label: cod + " — " + CATALOGO_ARTICULOS[cod].descripcion };
  });
  const grupoArticuloOpts = Object.keys(GRUPOS_ARTICULOS).map(function (codigo) {
    return { value: codigo, label: GRUPOS_ARTICULOS[codigo].label + " (" + GRUPOS_ARTICULOS[codigo].articulos.length + " artículos)" };
  });

  useEffect(function () {
    // Cambiar de compañía puede invalidar la lista seleccionada (cada
    // compañía habilita un conjunto distinto de listas de precio).
    if (nivel && listasDeCompania.indexOf(nivel) === -1) setNivel("");
  }, [compania]);

  useEffect(function () {
    setSimulado(false);
    setSent(false);
    setFilasExcel(null);
    setArchivoNombre(null);
    setArchivoS3Key(null);
    setErrorCarga(null);
    setItemsManual([]);
    setErrorItem(null);
    setGrupoArticulo("");
    setModalidad("manual");
    // Ni Gestión Global ni Descuento por Artículo gestionan la Lista Base
    // (MAYOREOD); si venía seleccionada desde otra pestaña, se limpia para
    // evitar un valor seleccionado que ya no aparece entre las opciones visibles.
    if ((tab === "FACTOR_PRECIO" || tab === "DESCUENTO_LISTA_PRECIO") && nivel === "mayoreod") setNivel("");
  }, [tab]);

  useEffect(function () {
    setSimulado(false);
    setSent(false);
  }, [compania, nivel, codigoArticulo, grupoArticulo, nivelLista, tipoVariacion, factor, ack, modalidad, itemsManual]);

  const conversionFactor = calcularVariacion(tipoVariacion, factor);
  const factorMultiplicador = conversionFactor.valido ? conversionFactor.factor : null;
  const factorInvalido = factor !== "" && !conversionFactor.valido;
  const modo = PROCESOS[tab].modo;
  const esDescuentoArticulo = tab === "DESCUENTO_LISTA_PRECIO";
  const esListaBase = tab === "MAYOREOD_MASIVO";
  const esGestionGlobal = tab === "FACTOR_PRECIO";
  const articuloSeleccionado = esDescuentoArticulo ? CATALOGO_ARTICULOS[codigoArticulo] : null;
  const grupoSeleccionado = esListaBase ? GRUPOS_ARTICULOS[grupoArticulo] : null;
  // En Descuento por Artículo, la clave funcional es Artículo + Lista de
  // Precio: un mismo artículo puede configurarse en listas diferentes.
  const articulosListaYaAgregados = itemsManual.map(function (it) { return it.codigo + "|" + it.listaCodigo; });

  // MAYOREOD es exclusivo de la Lista Base; la carga masiva pertenece a Descuento por Artículo.
  const permiteExcel = esDescuentoArticulo;
  const listaFueraDeAmbito = !!nivel && !estaEnAmbito(currentUser, null, nivel);
  const conteoErroresExcel = filasExcel ? filasExcel.filter(function (f) { return !f.validacion.valido; }).length : 0;
  const filasExcelFueraDeAmbito = esDescuentoArticulo && modalidad === "excel" && filasExcel && filasExcel.some(function (f) {
    return !f.listaCodigo || !estaEnAmbito(currentUser, null, f.listaCodigo);
  });

  function agregarItem() {
    const conversionItem = calcularVariacion(tipoVariacion, factor);
    const claveArticuloLista = codigoArticulo + "|" + nivel;
    if (!codigoArticulo || !nivel || factorInvalido || factor === "") return;
    if (articulosListaYaAgregados.indexOf(claveArticuloLista) !== -1) {
      setErrorItem("El artículo " + codigoArticulo + " ya fue agregado para la lista " + (NOMBRES_LISTA[nivel] || nivel) + ".");
      return;
    }
    setErrorItem(null);
    setItemsManual(function (list) {
      return list.concat([{
        fila: list.length + 1,
        codigo: codigoArticulo,
        listaCodigo: nivel,
        lista: NOMBRES_LISTA[nivel] || nivel,
        tipoVariacion: tipoVariacion,
        variacionPorcentaje: conversionItem.porcentaje,
        valorPropuestoRaw: textoFactorCalculado(conversionItem.factor),
      }]);
    });
    setCodigoArticulo("");
    setFactor("");
  }

  function quitarItem(codigo, listaCodigo) {
    setItemsManual(function (list) {
      return list.filter(function (it) { return it.codigo !== codigo || it.listaCodigo !== listaCodigo; }).map(function (it, idx) { return Object.assign({}, it, { fila: idx + 1 }); });
    });
  }

  function camposManualCompletos() {
    if (!compania) return false;
    if (esListaBase) return !!grupoArticulo && !factorInvalido && factor !== "" && ack;
    if (esDescuentoArticulo) return itemsManual.length > 0 && !!nivel && !listaFueraDeAmbito;
    return !!nivel && !factorInvalido && factor !== "" && !listaFueraDeAmbito;
  }

  function camposCompletos() {
    if (modalidad === "excel" && permiteExcel) {
      return !!filasExcel && filasExcel.length > 0 && conteoErroresExcel === 0 && !filasExcelFueraDeAmbito && !!compania;
    }
    return camposManualCompletos();
  }

  function puedeEnviar() {
    return simulado && camposCompletos() && !readOnly;
  }

  function handleSimular() {
    if (!camposCompletos()) return;
    if (modalidad === "manual") {
      if (esListaBase) {
        setFilasExcel(construirFilasMayoreodMasivo(grupoArticulo, textoFactorCalculado(factorMultiplicador), "AUMENTO", conversionFactor.magnitud));
      } else if (esDescuentoArticulo) {
        // Carga individual: cada fila corresponde a un artículo agregado con
        // "+", con los mismos campos que persistirá dbo.DESCUENTO_LISTA_PRECIO.
        setFilasExcel(itemsManual.map(function (it) { return construirFilaCompleta(it, modo); }));
      } else if (esGestionGlobal) {
        setFilasExcel(construirFilasGestionGlobal(nivel, textoFactorCalculado(factorMultiplicador), "AUMENTO", conversionFactor.magnitud));
      }
    }
    setSimulado(true);
  }

  function handleArchivoParsed(filas, nombre, s3Key) {
    const filasValidadas = esDescuentoArticulo ? filas.map(function (fila) {
      if (fila.listaCodigo === "mayoreod") {
        return Object.assign({}, fila, {
          validacion: Object.assign({}, fila.validacion, {
            valido: false,
            causa: "La Lista Base (MAYOREOD) no se gestiona desde Descuento por Artículo; use Actualización Masiva de Precios.",
          }),
        });
      }
      if (fila.listaCodigo && estaEnAmbito(currentUser, null, fila.listaCodigo)) return fila;
      return Object.assign({}, fila, {
        validacion: Object.assign({}, fila.validacion, {
          valido: false,
          causa: "La lista de precio de esta fila no está dentro de su ámbito autorizado.",
        }),
      });
    }) : filas;
    setFilasExcel(filasValidadas);
    setArchivoNombre(nombre);
    setArchivoS3Key(s3Key);
    setErrorCarga(null);
    setSimulado(false);
  }

  function resetFormulario() {
    setSent(false);
    setSimulado(false);
    setFactor("");
    setTipoVariacion("AUMENTO");
    setCodigoArticulo("");
    setGrupoArticulo("");
    setNivelLista("");
    setAck(false);
    setFilasExcel(null);
    setArchivoNombre(null);
    setArchivoS3Key(null);
    setItemsManual([]);
    setErrorItem(null);
  }

  function handleEnviar() {
    if (!puedeEnviar() || sending) return;
    // Validación defensiva de ámbito (RF-03): la interfaz nunca debe poder
    // enviar una solicitud fuera del ámbito autorizado del usuario, incluso
    // si el estado del formulario quedara inconsistente.
    if (!estaEnAmbito(currentUser, compania, esDescuentoArticulo && modalidad === "manual" ? nivel : null) || filasExcelFueraDeAmbito) {
      setErrorItem("Esta solicitud está fuera de su ámbito autorizado (compañía o lista). No puede enviarse.");
      return;
    }
    setSending(true);
    setTimeout(function () {
      onSubmit({
        proceso: tab,
        modalidad: modalidad,
        compania: compania,
        parametros: {
          nivel: nivel,
          factor: (esGestionGlobal || esListaBase) && factorMultiplicador != null ? textoFactorCalculado(factorMultiplicador) : null,
          tipoVariacion: (esGestionGlobal || esListaBase) && factor !== "" ? "AUMENTO" : null,
          variacionPorcentaje: (esGestionGlobal || esListaBase) && factor !== "" ? conversionFactor.porcentaje : null,
          listaBase: esListaBase ? LISTA_BASE_OBJETIVO.codigo : null,
          nivelPrecio: esListaBase ? LISTA_BASE_OBJETIVO.nivelPrecio : null,
          grupoArticulos: esListaBase ? grupoArticulo : null,
          articulos: esDescuentoArticulo ? (modalidad === "excel" ? filasExcel : itemsManual) : null,
        },
        filas: filasExcel || [],
        archivoNombre: archivoNombre,
        archivoS3Key: archivoS3Key,
      });
      setSending(false);
      setSent(true);
      setTimeout(resetFormulario, 1300);
    }, 850);
  }

  return (
    <div className="card p-6 combo-parent">
      <div className="tabs-list mb-6">
        {Object.keys(PROCESOS).map(function (key) {
          return (
            <span key={key} className={"tab-trigger" + (tab === key ? " active" : "")} onClick={function () { setTab(key); }}>
              {PROCESOS[key].label}
            </span>
          );
        })}
      </div>

      <h3 className="text-sm font-semibold mb-1">{PROCESOS[tab].desc}</h3>

      <div className="max-w-xs mb-4">
        <label className="block text-xs font-medium text-zinc-500 mb-1.5">Compañía</label>
        <div className="flex items-center gap-2 rounded-lg border border-zinc-200 bg-zinc-50 px-3 py-2">
          <Icon name="lock" className="w-3.5 h-3.5 text-zinc-400" />
          <span className="text-sm font-medium text-zinc-700">{compania || "Sin compañía asignada"}</span>
        </div>
        <p className="text-[11px] text-zinc-400 mt-1">Contexto resuelto automáticamente por Softland Security (S2/SS) a partir de su sesión. No es editable.</p>
        {!compania && <p className="text-[11px] text-red-600 mt-1">Su cuenta no tiene una compañía asignada en S2/SS; no puede operar este módulo.</p>}
      </div>

      {esDescuentoArticulo && (
        <div className="flex items-center gap-2 my-4">
          <button type="button" className={"subtab" + (modalidad === "manual" ? " active" : "")} disabled={readOnly}
            onClick={function () { setModalidad("manual"); }}>
            Captura Manual
          </button>
          <button type="button" className={"subtab" + (modalidad === "excel" ? " active" : "")} disabled={readOnly}
            onClick={function () { setModalidad("excel"); }}>
            Carga Masiva por Plantilla Excel
          </button>
        </div>
      )}

      {modalidad === "manual" && tab === "FACTOR_PRECIO" && (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label className="block text-xs font-medium text-zinc-500 mb-1.5">Lista de Precio</label>
            <Combobox id={"nivel-" + tab} value={nivel} onChange={function (o) { setNivel(o.value); }} options={nivelOptsSinListaBase} placeholder="Seleccionar lista..." disabled={readOnly} />
            {nivelOptsSinListaBase.length === 0 && <p className="text-[11px] text-red-600 mt-1">No tiene listas autorizadas.</p>}
            <p className="text-[11px] text-zinc-400 mt-1">La lista base (MAYOREOD) se gestiona exclusivamente desde Actualización Masiva de Precios. La versión activa de la lista se valida automáticamente contra la base de datos; no requiere selección manual.</p>
          </div>
          <div>
            <label className="block text-xs font-medium text-zinc-500 mb-1.5">Factor %</label>
            <input type="number" step="0.01" min="0" value={factor} disabled={readOnly}
              onChange={function (e) { setFactor(e.target.value); }}
              placeholder="Ej. 10"
              className="w-full text-sm px-3 py-2 rounded-lg border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-zinc-900/10 focus:border-zinc-900 disabled:bg-zinc-50 disabled:text-zinc-400" />
            <p className="text-[11px] text-zinc-400 mt-1">Ingrese la magnitud del cambio como porcentaje. Se aplicará como Aumento sobre la lista seleccionada.</p>
            {!factorInvalido && factor !== "" && <p className="text-[11px] text-zinc-500 mt-1">Factor calculado: <b className="mono">{textoFactorCalculado(factorMultiplicador)}</b></p>}
            {factorInvalido && <p className="text-[11px] text-red-600 mt-1 flex items-center gap-1"><Icon name="alertTriangle" className="w-3 h-3" /> {conversionFactor.causa}</p>}
          </div>
        </div>
      )}

      {modalidad === "manual" && esDescuentoArticulo && (
        <div className="space-y-4 mb-4">
          <div className="rounded-lg bg-zinc-50 border border-zinc-200 px-3 py-2 text-[11px] text-zinc-500">
            Agregue uno o más artículos con su factor.
          </div>

          <div className="max-w-md">
            <label className="block text-xs font-medium text-zinc-500 mb-1.5">Lista de Precio</label>
            <Combobox id={"nivel-" + tab} value={nivel} onChange={function (o) { setNivel(o.value); }} options={nivelOptsSinListaBase} placeholder={compania ? "Seleccionar lista..." : "Seleccione primero una compañía"} disabled={readOnly || !compania} />
            {!compania && <p className="text-[11px] text-amber-700 mt-1">Seleccione una compañía para cargar sus listas de precio disponibles.</p>}
            {compania && nivelOptsSinListaBase.length === 0 && <p className="text-[11px] text-red-600 mt-1">No tiene listas autorizadas para esta compañía.</p>}
            <p className="text-[11px] text-zinc-400 mt-1">La lista base (MAYOREOD) se gestiona exclusivamente desde Actualización Masiva de Precios.</p>
          </div>

          <div className="combo-parent">
            <div className="rounded-lg border border-zinc-200 p-3 mb-3">
              <p className="text-[11px] font-medium text-zinc-500 mb-2">Filtrar artículos por</p>
              <div className="grid grid-cols-2 md:grid-cols-6 gap-2">
                <div>
                  <label className="block text-[11px] text-zinc-400 mb-1">Categoría</label>
                  <Combobox id="filtro-categoria" value={filtroCategoria} onChange={function (o) { setFiltroCategoria(o.value); setCodigoArticulo(""); }}
                    options={[{ value: "", label: "Todas" }].concat(FILTROS_ARTICULOS.categoria.map(function (v) { return { value: v, label: v }; }))}
                    placeholder="Todas" disabled={readOnly} />
                </div>
                <div>
                  <label className="block text-[11px] text-zinc-400 mb-1">Subcategoría</label>
                  <Combobox id="filtro-subcategoria" value={filtroSubcategoria} onChange={function (o) { setFiltroSubcategoria(o.value); setCodigoArticulo(""); }}
                    options={[{ value: "", label: "Todas" }].concat(FILTROS_ARTICULOS.subcategoria.map(function (v) { return { value: v, label: v }; }))}
                    placeholder="Todas" disabled={readOnly} />
                </div>
                <div>
                  <label className="block text-[11px] text-zinc-400 mb-1">Grupo</label>
                  <Combobox id="filtro-grupo" value={filtroGrupo} onChange={function (o) { setFiltroGrupo(o.value); setCodigoArticulo(""); }}
                    options={[{ value: "", label: "Todos" }].concat(FILTROS_ARTICULOS.grupo.map(function (v) { return { value: v, label: v }; }))}
                    placeholder="Todos" disabled={readOnly} />
                </div>
                <div>
                  <label className="block text-[11px] text-zinc-400 mb-1">Marca</label>
                  <Combobox id="filtro-marca" value={filtroMarca} onChange={function (o) { setFiltroMarca(o.value); setCodigoArticulo(""); }}
                    options={[{ value: "", label: "Todas" }].concat(FILTROS_ARTICULOS.marca.map(function (v) { return { value: v, label: v }; }))}
                    placeholder="Todas" disabled={readOnly} />
                </div>
                <div>
                  <label className="block text-[11px] text-zinc-400 mb-1">Marca Grupo Compra</label>
                  <Combobox id="filtro-marca-grupo-compra" value={filtroMarcaGrupoCompra} onChange={function (o) { setFiltroMarcaGrupoCompra(o.value); setCodigoArticulo(""); }}
                    options={[{ value: "", label: "Todas" }].concat(FILTROS_ARTICULOS.marcaGrupoCompra.map(function (v) { return { value: v, label: v }; }))}
                    placeholder="Todas" disabled={readOnly} />
                </div>
                <div>
                  <label className="block text-[11px] text-zinc-400 mb-1">BDF</label>
                  <Combobox id="filtro-bdf" value={filtroBdf} onChange={function (o) { setFiltroBdf(o.value); setCodigoArticulo(""); }}
                    options={[{ value: "", label: "Todos" }].concat(FILTROS_ARTICULOS.bdf.map(function (v) { return { value: v, label: v }; }))}
                    placeholder="Todos" disabled={readOnly} />
                </div>
              </div>
              <p className="text-[11px] text-zinc-400 mt-2">{articuloOpts.length} artículo(s) coinciden con los filtros aplicados.</p>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-6 gap-3 items-start">
              <div className="md:col-span-2">
                <label className="block text-xs font-medium text-zinc-500 mb-1.5">Código de Artículo</label>
                <Combobox id="codigo-articulo" value={codigoArticulo} onChange={function (o) { setCodigoArticulo(o.value); setErrorItem(null); }} options={articuloOpts} placeholder="Buscar artículo..." disabled={readOnly} />
              </div>
              <div className="md:col-span-2">
                <label className="block text-xs font-medium text-zinc-500 mb-1.5">Tipo de Variación</label>
                <TipoVariacionSelect value={tipoVariacion} onChange={setTipoVariacion} disabled={readOnly} />
              </div>
              <div>
                <label className="block text-xs font-medium text-zinc-500 mb-1.5">Factor %</label>
                <input type="number" step="0.01" min="0" value={factor} disabled={readOnly}
                  onChange={function (e) { setFactor(e.target.value); }}
                  placeholder="Ej. 10"
                  className="w-full text-sm px-3 py-2 rounded-lg border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-zinc-900/10 focus:border-zinc-900 disabled:bg-zinc-50 disabled:text-zinc-400" />
              </div>
              <div className="pt-5">
                <button type="button" className="btn btn-outline w-full" disabled={readOnly || !nivel || !codigoArticulo || factorInvalido || factor === ""}
                  onClick={agregarItem}>
                  <Icon name="plus" className="w-3.5 h-3.5" /> Agregar
                </button>
              </div>
            </div>

            {articuloSeleccionado && (
              <div className="grid grid-cols-4 gap-3 mt-3">
                <div className="card p-2.5"><p className="text-[10px] text-zinc-400">Descripción</p><p className="text-xs font-medium">{articuloSeleccionado.descripcion}</p></div>
