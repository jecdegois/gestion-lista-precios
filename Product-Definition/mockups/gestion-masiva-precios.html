/* =========================================================================
   SIMULADOR DINÁMICO DE ESTADO DE PROCESO (Stored Procedure de larga
   duración). Componente de UI que visualiza explícitamente la secuencia
   PENDIENTE -> EN PROCESO -> COMPLETADO / ERROR. La transición real entre
   estos estados la disparan los setTimeout de handleAprobarInicio (App); este
   componente solo traduce el estado actual de la solicitud a una barra de
   pasos, permitiendo comprobar visualmente en qué punto del flujo se
   encuentra mientras el trabajo de fondo continúa. */
function pasoDeEstadoProceso(estado) {
  if (estado === "PENDIENTE") return 0;
  if (estado === "EN_PROCESO") return 1;
  return 2; // PROCESADO, PROCESADO_CON_ERRORES, ERROR_EJECUCION, RECHAZADO
}

function SimuladorEstadoProceso({ estado }) {
  const esError = estado === "ERROR_EJECUCION" || estado === "RECHAZADO";
  const pasos = [
    { key: "PENDIENTE", label: "Pendiente" },
    { key: "EN_PROCESO", label: "En proceso" },
    { key: "TERMINAL", label: esError ? "Error" : "Completado" },
  ];
  const pasoActual = pasoDeEstadoProceso(estado);

  return (
    <div className="flex items-center gap-2" role="status" aria-label={"Estado del proceso: " + pasos[pasoActual].label}>
      {pasos.map(function (paso, idx) {
        const completado = idx < pasoActual;
        const activo = idx === pasoActual;
        const esUltimoActivoError = activo && idx === 2 && esError;
        const circuloCls = esUltimoActivoError
          ? "bg-red-600 text-white border-red-600"
          : completado
            ? "bg-green-600 text-white border-green-600"
            : activo
              ? "bg-indigo-600 text-white border-indigo-600"
              : "bg-white text-zinc-400 border-zinc-300";
        return (
          <React.Fragment key={paso.key}>
            <div className="flex flex-col items-center gap-1">
              <div className={"w-7 h-7 rounded-full border-2 flex items-center justify-center text-[11px] font-semibold " + circuloCls}>
                {completado ? <Icon name="check" className="w-3.5 h-3.5" /> : (esUltimoActivoError ? <Icon name="x" className="w-3.5 h-3.5" /> : (idx + 1))}
                {activo && !esUltimoActivoError && idx === 1 && <span className="sr-only">En curso</span>}
              </div>
              <span className={"text-[11px] " + (activo ? "font-semibold text-zinc-800" : "text-zinc-400")}>{paso.label}</span>
            </div>
            {idx < pasos.length - 1 && (
              <div className={"h-0.5 w-10 mb-4 " + (idx < pasoActual ? "bg-green-500" : "bg-zinc-200")}></div>
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}

/* =========================================================================
   MODAL: REVISIÓN -> EN PROCESO -> RESULTADO CON DESGLOSE FILA POR FILA
   ========================================================================= */
function RevisionModal({ solicitud, currentUser, onClose, onRechazar, onIniciarEjecucion, onSimularSolicitud }) {
  const [motivo, setMotivo] = useState("");
  const [filasSimuladasComoSolicitante, setFilasSimuladasComoSolicitante] = useState(null);
  const [simulacionConfirmada, setSimulacionConfirmada] = useState(false);
  const overlayRef = useRef(null);

  if (!solicitud) return null;

  const filasOriginales = solicitud.filas && solicitud.filas.length > 0 ? solicitud.filas : filasEjemploExcel(PROCESOS[solicitud.proceso].modo);
  const filas = filasSimuladasComoSolicitante || filasOriginales;
  const parametros = solicitud.parametros || {};
  const esActualizacionListaBase = solicitud.proceso === "MAYOREOD_MASIVO";
  const grupoArticulo = esActualizacionListaBase ? GRUPOS_ARTICULOS[parametros.grupoArticulos] : null;
  const puedeDecidir = currentUser.rol === "APROBADOR" && solicitud.estado === "PENDIENTE" && solicitud.solicitanteEmail !== currentUser.email;
  const puedeAprobar = puedeDecidir && simulacionConfirmada;
  const filasConHallazgo = filas.filter(function (f) { return !f.validacion.valido; });
  const estaEnProceso = solicitud.estado === "EN_PROCESO";
  const resultado = solicitud.resultado || null;

  function handleOverlayClick(ev) {
    if (!ev || !ev.target || ev.target !== overlayRef.current) return;
    onClose();
  }

  function simularComoSolicitante() {
    if (!puedeDecidir) return;
    const simulacion = filasOriginales.map(function (fila) {
      const recalculada = construirFilaCompleta({
        fila: fila.fila,
        codigo: fila.codigo,
        tipoVariacion: fila.tipoVariacion,
        variacionPorcentaje: fila.variacionPorcentaje,
        valorPropuestoRaw: fila.valorPropuestoRaw,
      }, PROCESOS[solicitud.proceso].modo);
      return Object.assign({}, fila, recalculada);
    });
    setFilasSimuladasComoSolicitante(simulacion);
    setSimulacionConfirmada(true);
    if (onSimularSolicitud) onSimularSolicitud(solicitud.id);
  }

  function iniciarEjecucion() {
    if (!puedeAprobar) return;
    onIniciarEjecucion(solicitud.id, filas);
    onClose();
  }

  function descargarLogAuditoria() {
    if (!resultado) return;
    descargarTexto(nombreArchivoS3("log-auditoria-" + solicitud.id, "csv"), filasADataCsv(resultado.filas));
  }

  function descargarSoloFallidas() {
    if (!resultado) return;
    const soloFallidas = resultado.filas.filter(function (f) { return !f.validacion.valido; });
    descargarExcelFilas(nombreArchivoS3("filas-a-corregir-" + solicitud.id, "xlsx"), soloFallidas);
  }

  return (
    <div className="modal-overlay" ref={overlayRef} onClick={handleOverlayClick}>
      <div className="modal-box" onClick={function (e) { e.stopPropagation(); }}>
        <div className="p-6 border-b border-zinc-100 flex items-start justify-between gap-4">
          <div>
            <div className="flex items-center gap-2 mb-1 flex-wrap">
              <h2 className="text-lg font-semibold">Detalle de solicitud — <span className="mono">{solicitud.id}</span></h2>
              <span className="badge badge-outline">{PROCESOS[solicitud.proceso].label}</span>
              <EstadoBadge estado={solicitud.estado} />
            </div>
            <p className="text-xs text-zinc-500">Solicitante: <b>{solicitud.solicitanteNombre}</b> · Compañía: <b>{solicitud.compania}</b> · Enviado: {solicitud.fechaEnvio}</p>
            {solicitud.archivoNombre && <p className="text-xs text-zinc-400 mt-1 flex items-center gap-1"><Icon name="fileSpreadsheet" className="w-3.5 h-3.5" /> Plantilla: {solicitud.archivoNombre}</p>}
          </div>
          <button className="btn btn-ghost" onClick={onClose}><Icon name="x" className="w-4 h-4" /></button>
        </div>

        <div className="p-6 space-y-5">
          {solicitud.estado !== "RECHAZADO" && (
            <div className="rounded-lg border border-zinc-200 bg-zinc-50 p-4 overflow-x-auto">
              <p className="text-[11px] font-medium text-zinc-500 mb-3">Progreso del procesamiento en segundo plano</p>
              <SimuladorEstadoProceso estado={solicitud.estado} />
            </div>
          )}

          {estaEnProceso && (
            <div className="rounded-lg border border-indigo-200 bg-indigo-50 p-4 flex gap-3">
              <span className="text-indigo-600 mt-0.5"><Icon name="clock" className="w-5 h-5" /></span>
              <div>
                <p className="text-sm font-semibold text-indigo-900">La solicitud se está procesando en segundo plano</p>
                <p className="text-xs text-indigo-800 mt-1">ID de procesamiento: <span className="mono font-medium">{solicitud.idProcesoSP}</span>. Puede cerrar este detalle, navegar o salir del sistema. La solicitud cambiará automáticamente a Procesada, Procesada con errores o Error de ejecución al finalizar.</p>
                <div className="progress-track mt-3"><div className="progress-fill progress-indeterminate"></div></div>
                <p className="text-xs text-indigo-700 mt-2">Última actualización: {solicitud.ultimaActualizacion || "recién iniciada"}</p>
              </div>
            </div>
          )}

          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div className="card p-3"><p className="text-[11px] text-zinc-400">Filas evaluadas</p><p className="text-lg font-semibold">{filas.length}</p></div>
            <div className="card p-3"><p className="text-[11px] text-zinc-400">Con hallazgo</p><p className="text-lg font-semibold text-red-600">{filasConHallazgo.length}</p></div>
            <div className="card p-3"><p className="text-[11px] text-zinc-400">Modalidad</p><p className="text-sm font-semibold">{solicitud.modalidad === "excel" ? "Plantilla Excel" : "Captura manual"}</p></div>
            <div className="card p-3"><p className="text-[11px] text-zinc-400">Ejecución</p><p className="text-sm font-semibold">{PROCESOS[solicitud.proceso].ejecucion}</p></div>
          </div>

          {esActualizacionListaBase && (
            <div className="rounded-lg border border-red-200 bg-red-50 p-4">
              <p className="text-xs font-semibold text-red-800 mb-3">Resumen para autorizar la ejecución sobre la Lista Base</p>
              <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Lista Base</p><p className="text-sm font-semibold">{LISTA_BASE_OBJETIVO.nombre} / {parametros.listaBase || LISTA_BASE_OBJETIVO.codigo}</p></div>
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Nivel de precio</p><p className="text-sm font-semibold">{parametros.nivelPrecio || LISTA_BASE_OBJETIVO.nivelPrecio}</p></div>
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Grupo de artículos</p><p className="text-sm font-semibold">{grupoArticulo ? grupoArticulo.label : "No especificado"}</p></div>
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Factor aplicado</p><p className="text-sm font-semibold mono">{parametros.factor || "—"}</p></div>
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Registros impactados</p><p className="text-sm font-semibold">{filas.length}</p></div>
              </div>
            </div>
          )}

          {puedeDecidir && (
            <div className={"rounded-lg border px-4 py-3 text-xs " + (simulacionConfirmada ? "border-green-200 bg-green-50 text-green-800" : "border-zinc-200 bg-zinc-50 text-zinc-600")}>
              <div className="flex items-center justify-between gap-3 flex-wrap">
                <div>
                  <p className="font-semibold">Simulación con los parámetros del Solicitante</p>
                  <p className="mt-1">{simulacionConfirmada ? "Simulación completada con los parámetros enviados por " + solicitud.solicitanteNombre + ". Puede tomar la decisión." : "Antes de aprobar, simule el impacto con los parámetros enviados por " + solicitud.solicitanteNombre + " (rol Solicitante)."}</p>
                </div>
                <button className="btn btn-outline" onClick={simularComoSolicitante}><Icon name="refreshCw" className="w-3.5 h-3.5" /> {simulacionConfirmada ? "Simular nuevamente" : "Simular como solicitante"}</button>
              </div>
            </div>
          )}

          <TablaPrevisualizacion filas={filas} compacta={false} />

          {resultado && (
            <React.Fragment>
              <div className="flex items-center gap-2 mb-2 flex-wrap">
                <Icon name="fileWarning" className="w-4 h-4 text-zinc-500" />
                <p className="text-sm font-semibold">Resultado final del procesamiento</p>
                <span className={"badge " + (resultado.estadoFinal === "PROCESADO" ? "badge-ok" : resultado.estadoFinal === "PROCESADO_CON_ERRORES" ? "badge-costo" : "badge-error")}>
                  {textoResultadoAuditoria(resultado.estadoFinal, resultado.exitosos, resultado.fallidos)}
                </span>
              </div>
              <div className="grid grid-cols-4 gap-3">
                <div className="card p-3"><p className="text-[11px] text-zinc-400">ID de procesamiento</p><p className="mono text-sm font-medium">{solicitud.idProcesoSP}</p></div>
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Autorizado por</p><p className="text-sm font-medium">{resultado.aprobadoPor}</p></div>
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Filas exitosas</p><p className="text-xl font-semibold text-green-600">{resultado.exitosos}</p></div>
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Filas con error</p><p className="text-xl font-semibold text-orange-600">{resultado.fallidos}</p></div>
              </div>
              <div className="mt-3 rounded-lg bg-zinc-50 border border-zinc-200 px-4 py-3 flex items-center justify-between flex-wrap gap-3">
                <p className="s3-tag mono">Log de auditoría: s3://erp-precios-logs/{resultado.logS3Key.split("/")[1]}</p>
                <div className="flex items-center gap-2">
                  <button className="btn btn-outline" onClick={descargarLogAuditoria}><Icon name="download" className="w-3.5 h-3.5" /> Descargar Log (CSV)</button>
                  <button className="btn btn-outline" disabled={resultado.fallidos === 0} onClick={descargarSoloFallidas}><Icon name="refreshCw" className="w-3.5 h-3.5" /> Exportar errores (Excel)</button>
                </div>
              </div>
            </React.Fragment>
          )}

          {puedeDecidir && (
            <div className="border-t border-zinc-100 pt-4">
              <label className="block text-xs font-medium mb-1.5">Motivo de rechazo <span className="text-red-600">*</span></label>
              <textarea rows={2} value={motivo} onChange={function (e) { setMotivo(e.target.value); }} placeholder="Obligatorio si la decisión es rechazar la solicitud..." className="w-full text-sm px-3 py-2 rounded-lg border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-zinc-900/10" />
            </div>
          )}
        </div>

        <div className="p-6 border-t border-zinc-100 flex items-center justify-end gap-2">
          {puedeDecidir ? (
            <React.Fragment>
              <button className="btn btn-outline text-red-600" disabled={motivo.trim().length === 0} onClick={function () { onRechazar(solicitud.id, motivo.trim()); onClose(); }}>Rechazar</button>
              <button className="btn btn-destructive" disabled={!puedeAprobar} title={!simulacionConfirmada ? "Primero simule el impacto con los parámetros del solicitante." : undefined} onClick={iniciarEjecucion}>Procesar Solicitud</button>
            </React.Fragment>
          ) : (
            <button className="btn btn-default" onClick={onClose}>{estaEnProceso ? "Continuar trabajando" : "Cerrar"}</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   AUDITORÍA (log derivado de los cambios de estado)
   Traduce las claves técnicas de evento a lenguaje de negocio y muestra el
   resultado del control de estados del procesamiento en segundo plano: cuando
   la ejecución finaliza, la auditoría deja constancia explícita de si quedó
   OK / ejecutada completa, con errores parciales, o en error.
   ========================================================================= */
const EVENTOS_AUDITORIA = {
  SOLICITUD_ENVIADA: "Solicitud enviada a aprobación",
  SOLICITUD_RECHAZADA: "Solicitud rechazada",
  SIMULACION_REVISADA: "Simulación revisada por el aprobador",
  SIMULACION_EJECUTADA_COMO_SOLICITANTE: "Simulación verificada con los parámetros del solicitante",
  EJECUCION_ENCOLADA: "Ejecución autorizada y encolada",
  EJECUCION_FINALIZADA: "Procesamiento en segundo plano finalizado",
};

function etiquetaEvento(evento) {
  return EVENTOS_AUDITORIA[evento] || evento;
}

function textoResultadoAuditoria(estadoFinal, exitosos, fallidos) {
  const total = exitosos + fallidos;
  if (estadoFinal === "PROCESADO") return "OK · Ejecutado completo (" + exitosos + " de " + total + " registros)";
  if (estadoFinal === "PROCESADO_CON_ERRORES") return "Completado con errores (" + exitosos + " exitosos, " + fallidos + " con error de " + total + ")";
  return "Error de ejecución (0 de " + total + " registros aplicados)";
}

function Auditoria({ eventos }) {
  return (
    <div className="card overflow-hidden">
      <table className="w-full text-sm">
        <thead className="bg-zinc-50 text-xs text-zinc-500">
          <tr>
            <th className="text-left font-medium px-4 py-3">Fecha/Hora</th>
            <th className="text-left font-medium px-4 py-3">Usuario</th>
            <th className="text-left font-medium px-4 py-3">Rol</th>
            <th className="text-left font-medium px-4 py-3">Evento</th>
            <th className="text-left font-medium px-4 py-3">ID Solicitud</th>
            <th className="text-left font-medium px-4 py-3">ID de Proceso</th>
          </tr>
        </thead>
        <tbody className="divide-y divide-zinc-100">
          {eventos.length === 0 && (
            <tr><td colSpan={6} className="px-4 py-10 text-center text-zinc-400">Sin eventos registrados en esta sesión todavía.</td></tr>
          )}
          {eventos.map(function (e) {
            return (
              <tr key={e.id}>
                <td className="px-4 py-3 mono text-zinc-500">{e.fecha}</td>
                <td className="px-4 py-3">{e.usuario}</td>
                <td className="px-4 py-3"><span className="badge badge-outline">{e.rol}</span></td>
                <td className="px-4 py-3"><span className="badge badge-outline">{etiquetaEvento(e.evento)}</span></td>
                <td className="px-4 py-3 mono">{e.solicitudId || "—"}</td>
                <td className="px-4 py-3 mono">{e.idProcesoSP || "—"}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

/* =========================================================================
   APP RAÍZ

function seedSolicitudes() {
  const filasAprobadas = [
    { fila: 1, codigo: "ART-231", tipoVariacion: "AUMENTO", valorPropuestoRaw: "1.10", variacionPorcentaje: 10 },
    { fila: 2, codigo: "ART-455", tipoVariacion: "AUMENTO", valorPropuestoRaw: "1.10", variacionPorcentaje: 10 },
  ].map(function (r) { return construirFilaCompleta(r, "factor"); });
  const filasMayoreod = construirFilasMayoreodMasivo("linea_blanca", "1.10", "AUMENTO", 10);
  const filasDescuentoMasivo = [
    { fila: 1, listaCodigo: "mayoreob", codigo: "ART-231", tipoVariacion: "AUMENTO", variacionPorcentaje: 10 },
    { fila: 2, listaCodigo: "lpv1", codigo: "ART-455", tipoVariacion: "DISMINUCION", variacionPorcentaje: 5 },
  ].map(construirFilaDescuentoMasivo);

  // Las tres solicitudes semilla pertenecen a la compañía SILLACA, resuelta
  // por S2/SS a partir del dominio de correo de la sesión simulada, para
  // demostrar de forma real el aislamiento por compañía (ninguna solicitud
  // de otra compañía sería visible para esta sesión).
  return [
    { id: "SOL-10449", proceso: "FACTOR_PRECIO", modalidad: "manual", compania: "SILLACA", solicitanteNombre: "Juan Pérez", solicitanteEmail: "jperez@sillaca.com", parametros: { factor: "1.10" }, filas: filasAprobadas, archivoNombre: null, archivoS3Key: null, fechaEnvio: "2026-08-13 11:30", estado: "PROCESADO", motivoRechazo: null, idProcesoSP: "#PROC-20260813-2210", resultado: { totalLote: 2, exitosos: 2, fallidos: 0, filas: filasAprobadas, estadoFinal: "PROCESADO", logS3Key: "erp-precios-logs/log-auditoria-SOL-10449.csv", aprobadoPor: "María Rodríguez", aprobadoPorEmail: "mrodriguez@sillaca.com" } },
    { id: "SOL-10448", proceso: "MAYOREOD_MASIVO", modalidad: "manual", compania: "SILLACA", solicitanteNombre: "Juan Pérez", solicitanteEmail: "jperez@sillaca.com", parametros: { listaBase: LISTA_BASE_OBJETIVO.codigo, nivelPrecio: LISTA_BASE_OBJETIVO.nivelPrecio, grupoArticulos: "linea_blanca", factor: "1.10", variacionPorcentaje: 10 }, filas: filasMayoreod, archivoNombre: null, archivoS3Key: null, fechaEnvio: "2026-08-13 09:05", estado: "PENDIENTE", motivoRechazo: null, idProcesoSP: null },
    { id: "SOL-10447", proceso: "DESCUENTO_LISTA_PRECIO", modalidad: "excel", compania: "SILLACA", solicitanteNombre: "Juan Pérez", solicitanteEmail: "jperez@sillaca.com", parametros: { articulos: filasDescuentoMasivo }, filas: filasDescuentoMasivo, archivoNombre: "descuento-articulos-masivo.xlsx", archivoS3Key: "erp-precios-uploads/descuento-articulos-masivo.xlsx", fechaEnvio: "2026-08-12 15:10", estado: "RECHAZADO", motivoRechazo: "El factor genera márgenes por debajo del costo en artículos de alto valor; corregir antes de reenviar.", idProcesoSP: null },
  ];
}

function App() {
  // Sin sesión activa por defecto: se muestra la pantalla de login hasta
  // que el usuario elija uno de los usuarios de ejemplo (uno por compañía).
  const [user, setUser] = useState(null);
  const [nav, setNav] = useState("nueva");
  const [solicitudes, setSolicitudes] = useState(seedSolicitudes());
  const [seq, setSeq] = useState(1);
  const [toasts, setToasts] = useState([]);
  const [modalId, setModalId] = useState(null);
  const [eventos, setEventos] = useState([]);

  useEffect(function () {
    if (!user) return;
    if (user.rol === "APROBADOR") setNav("bandeja");
    else if (user.rol === "OPERADOR") setNav("nueva");
    setModalId(null);
  }, [user]);

  function pushToast(message, variant) {
    const id = Date.now() + Math.random();
    setToasts(function (t) { return t.concat([{ id: id, message: message, variant: variant }]); });
    setTimeout(function () {
      setToasts(function (t) { return t.filter(function (x) { return x.id !== id; }); });
    }, 3400);
  }

  function registrarEvento(evento, extra) {
    const now = new Date();
    const fecha = now.toLocaleString("es-CR", { hour12: false });
    setEventos(function (evs) {
      return [{
        id: Date.now() + Math.random(),
        fecha: fecha,
        usuario: user.nombre,
        rol: user.rol,
        evento: evento,
        solicitudId: extra && extra.solicitudId,
        idProcesoSP: extra && extra.idProcesoSP,
      }].concat(evs);
    });
  }

  function handleNuevaSolicitud(payload) {
    const id = nuevoIdSolicitud(seq);
    setSeq(function (s) { return s + 1; });
    const now = new Date();
    const nueva = {
      id: id,
      proceso: payload.proceso,
      modalidad: payload.modalidad,
      compania: payload.compania,
      solicitanteNombre: user.nombre,
      solicitanteEmail: user.email,
      parametros: payload.parametros,
      filas: payload.filas,
      archivoNombre: payload.archivoNombre,
      archivoS3Key: payload.archivoS3Key,
      fechaEnvio: now.toLocaleString("es-CR", { hour12: false }),
      estado: "PENDIENTE",
      motivoRechazo: null,
      idProcesoSP: null,
    };
    setSolicitudes(function (list) { return [nueva].concat(list); });
    registrarEvento("SOLICITUD_ENVIADA", { solicitudId: id });
    pushToast("Solicitud " + id + " enviada a aprobación · Estado: Pendiente de aprobación", "success");
  }

  function handleRechazar(id, motivo) {
    setSolicitudes(function (list) {
      return list.map(function (s) { return s.id === id ? Object.assign({}, s, { estado: "RECHAZADO", motivoRechazo: motivo }) : s; });
    });
    registrarEvento("SOLICITUD_RECHAZADA", { solicitudId: id });
    pushToast("Solicitud " + id + " rechazada. El solicitante fue notificado.", "error");
  }

  function handleAprobarInicio(id, filasProcesadas) {
    const idProcesoSP = nuevoIdProcesoSP();
    const now = new Date();
    const inicio = now.toLocaleString("es-CR", { hour12: false });
    setSolicitudes(function (list) {
      return list.map(function (s) {
        return s.id === id ? Object.assign({}, s, {
          estado: "EN_PROCESO",
          idProcesoSP: idProcesoSP,
          filas: filasProcesadas || s.filas,
          autorizadoPor: user.nombre,
          autorizadoPorEmail: user.email,
          ultimaActualizacion: inicio,
        }) : s;
      });
    });
    registrarEvento("EJECUCION_ENCOLADA", { solicitudId: id, idProcesoSP: idProcesoSP });
    pushToast("Solicitud " + id + " en proceso. Puede continuar trabajando; la solicitud se procesa en segundo plano.", "success");

    // Ejercicio práctico: representa al worker/backend que procesa una cola.
    // En producción, el navegador nunca ejecuta ni espera el procesamiento:
    // solo consulta GET /solicitudes/{id} o recibe una notificación de resultado.
    // El tiempo de espera se mantiene perceptible (no instantáneo) para que
    // el usuario y la auditoría puedan constatar el estado "En proceso".
    setTimeout(function () {
      setSolicitudes(function (list) {
        return list.map(function (s) {
          if (s.id !== id || s.estado !== "EN_PROCESO") return s;
          const filasFinales = s.filas || [];
          const fallidos = filasFinales.filter(function (f) { return !f.validacion.valido; }).length;
          const exitosos = filasFinales.length - fallidos;
          const estadoFinal = fallidos === 0 ? "PROCESADO" : (fallidos === filasFinales.length ? "ERROR_EJECUCION" : "PROCESADO_CON_ERRORES");
          const resultado = {
            totalLote: filasFinales.length,
            exitosos: exitosos,
            fallidos: fallidos,
            filas: filasFinales,
            estadoFinal: estadoFinal,
            logS3Key: "erp-precios-logs/" + nombreArchivoS3("log-auditoria-" + id, "csv"),
            aprobadoPor: s.autorizadoPor || user.nombre,
            aprobadoPorEmail: s.autorizadoPorEmail || user.email,
          };
          return Object.assign({}, s, {
            estado: estadoFinal,
            resultado: resultado,
            ultimaActualizacion: new Date().toLocaleString("es-CR", { hour12: false }),
          });
        });
      });
      registrarEvento("EJECUCION_FINALIZADA", { solicitudId: id, idProcesoSP: idProcesoSP });
      pushToast("El procesamiento " + idProcesoSP + " finalizó. Consulte el detalle de la solicitud.", "success");
    }, 15000);
  }

  const solicitudModal = solicitudes.find(function (s) { return s.id === modalId; });

  function abrirModal(id) {
    const solicitud = solicitudes.find(function (item) { return item.id === id; });
    if (!solicitud) return;
    const esPropia = solicitud.solicitanteEmail === user.email;
    // El solicitante siempre puede consultar el detalle de su propia solicitud
    // (aunque esté Pendiente, En proceso, etc.), solo en modo lectura. Un
    // Aprobador puede además abrir solicitudes ajenas dentro de su ámbito
    // para revisarlas o decidir; nunca puede aprobar su propia solicitud.
    const puedeConsultar = esPropia || (user.rol === "APROBADOR" && estaEnAmbito(user, solicitud.compania, null));
    if (!puedeConsultar) return;
    setModalId(id);
    if (solicitud.estado === "PENDIENTE" && user.rol === "APROBADOR" && !esPropia) {
      registrarEvento("SIMULACION_REVISADA", { solicitudId: id });
    }
  }

  const esAprobador = user ? user.rol === "APROBADOR" : false;
  const esOperador = user ? user.rol === "OPERADOR" : false;

  // Sin sesión activa: se muestra la pantalla de login con los usuarios de
  // ejemplo (uno por compañía) en lugar del selector de identidad del header.
  if (!user) {
    return <LoginScreen onLogin={setUser} />;
  }

  return (
    <div>
      <Header user={user} onLogout={function () { setUser(null); }} onNav={setNav} activeNav={nav} />
      <Toaster toasts={toasts} />

      {user.rol === "SIN_PERMISO" ? (
        <Vista403 user={user} />
      ) : (
        <main className="max-w-7xl mx-auto px-6 py-8">
          {nav === "nueva" && (
            <div>
              <div className="mb-5">
                <h1 className="text-2xl font-semibold">Nueva solicitud de cambio de precio</h1>
              </div>
              <NuevaSolicitud readOnly={false} currentUser={user} onSubmit={handleNuevaSolicitud} />
              <MisSolicitudes solicitudes={solicitudes} currentUser={user} onVerDetalle={abrirModal} />
            </div>
          )}

          {nav === "bandeja" && (
            <div>
              <div className="mb-5">
                <h1 className="text-2xl font-semibold">Bandeja de aprobación</h1>
                <p className="text-sm text-zinc-500 mt-1">Solicitudes dentro de su ámbito. No puede aprobar solicitudes creadas por usted mismo.</p>
              </div>
              <BandejaAprobacion solicitudes={solicitudes} currentUser={user} readOnly={!esAprobador} onAbrir={abrirModal} />
            </div>
          )}

          {nav === "auditoria" && (
            <div>
              <div className="mb-5">
                <h1 className="text-2xl font-semibold">Auditoría y Logs</h1>
                <p className="text-sm text-zinc-500 mt-1">Historial de eventos generados durante esta sesión de simulación.</p>
              </div>
              <Auditoria eventos={eventos} />
            </div>
          )}
        </main>
      )}

      {solicitudModal && (
        <RevisionModal
          solicitud={solicitudModal}
          currentUser={user}
          onClose={function () { setModalId(null); }}
          onRechazar={handleRechazar}
          onIniciarEjecucion={handleAprobarInicio}
          onSimularSolicitud={function (id) {
            registrarEvento("SIMULACION_EJECUTADA_COMO_SOLICITANTE", { solicitudId: id });
            pushToast("Simulación de " + id + " completada con los parámetros del solicitante.", "success");
          }}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
