<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* =========================================================================

const ICONS = {

function Icon({ name, className = "w-4 h-4", spin = false }) {
  const d = ICONS[name];
  if (!d) return null;
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
      strokeLinecap="round" strokeLinejoin="round"
      className={className + (spin ? " spin" : "")}>
      <path d={d} />
    </svg>
  );
}

/* =========================================================================
   REGISTRO GLOBAL DE CIERRE DE COMBOBOX (patrón anti-regresión)
   ========================================================================= */
const comboRegistry = new Set();
document.addEventListener("click", function (e) {
  if (e && e.target && e.target.closest && e.target.closest(".combo-w")) return;
  comboRegistry.forEach(function (fn) { fn(); });
});
window.addEventListener("resize", function () { comboRegistry.forEach(function (fn) { fn(); }); });
window.addEventListener("scroll", function () { comboRegistry.forEach(function (fn) { fn(); }); }, true);

function Combobox({ id, value, onChange, options, placeholder, disabled }) {
  // Por ahora, solo el selector de artículos admite búsqueda libre. La opción
  // elegida continúa proviniendo exclusivamente del catálogo mostrado.
  const searchable = id === "codigo-articulo";
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState("");
  const [pos, setPos] = useState({ top: 0, left: 0, width: 0 });
  const triggerRef = useRef(null);

  useEffect(function () {
    const closeFn = function () { setOpen(false); };
    comboRegistry.add(closeFn);
    return function () { comboRegistry.delete(closeFn); };
  }, []);

  function computePosition() {
    const el = triggerRef.current;
    if (!el || !el.getBoundingClientRect) return;
    const rect = el.getBoundingClientRect();
    setPos({ top: rect.bottom + 4, left: rect.left, width: rect.width });
  }

  function handleOpen() {
    if (disabled) return;
    const wasOpen = open;
    comboRegistry.forEach(function (fn) { fn(); });
    if (!wasOpen) {
      if (searchable) setQuery("");
      computePosition();
      setOpen(true);
    }
  }

  function handlePick(ev, opt) {
    if (ev) ev.stopPropagation();
    if (opt.disabled) return;
    if (onChange) onChange(opt);
    setQuery("");
    setOpen(false);
  }

  function normalizar(texto) {
    return String(texto || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  const selected = options.find(function (o) { return o.value === value; });
  const consulta = normalizar(query.trim());
  const opcionesVisibles = !searchable || !consulta
    ? options
    : options.filter(function (opt) { return normalizar(opt.label).indexOf(consulta) !== -1; });
  const valorInput = searchable && open ? query : (selected ? selected.label : "");

  return (
    <div className="combo-w">
      <input
        id={id}
        ref={triggerRef}
        className="combo-in"
        readOnly={!searchable}
        disabled={!!disabled}
        value={valorInput}
        placeholder={placeholder || "Seleccionar..."}
        onFocus={handleOpen}
        onClick={handleOpen}
        onChange={function (ev) {
          if (!searchable) return;
          setQuery(ev.target.value);
          if (!open) {
            computePosition();
            setOpen(true);
          }
        }}
        onKeyDown={function (ev) {
          if (ev.key === "Escape") {
            setQuery("");
            setOpen(false);
          }
        }}
        style={searchable ? { cursor: "text" } : undefined}
      />
      <span className="chev"><Icon name="chevronDown" className="w-3.5 h-3.5" /></span>
      {open && !disabled && (
        <div className="combo-dd" style={{ top: pos.top, left: pos.left, width: pos.width }}>
          {opcionesVisibles.map(function (opt) {
            return (
              <div key={opt.value} className={"combo-opt" + (opt.disabled ? " opacity-40 cursor-not-allowed" : "")}
                title={opt.disabled ? "Fuera de su ámbito autorizado" : undefined}
                onClick={function (ev) { handlePick(ev, opt); }}>
                {opt.icon}
                <span>{opt.label}</span>
                {opt.disabled && <span className="badge badge-outline ml-auto" style={{ fontSize: 9 }}>Sin acceso</span>}
              </div>
            );
          })}
          {opcionesVisibles.length === 0 && (
            <div className="px-3 py-2 text-xs text-zinc-400">No se encontraron artículos por código o nombre.</div>
          )}
        </div>
      )}
    </div>
  );
}

function initials(nombre) {
  return nombre.split(" ").map(function (p) { return p[0]; }).join("").slice(0, 2).toUpperCase();
}

function IdentitySwitcher({ current, onChange }) {
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState({ top: 0, left: 0, width: 0 });
  const triggerRef = useRef(null);

  useEffect(function () {
    const closeFn = function () { setOpen(false); };
    comboRegistry.add(closeFn);
    return function () { comboRegistry.delete(closeFn); };
  }, []);

  function handleOpen() {
    const wasOpen = open;
    comboRegistry.forEach(function (fn) { fn(); });
    if (!wasOpen) {
      const el = triggerRef.current;
      if (el && el.getBoundingClientRect) {
        const rect = el.getBoundingClientRect();
        setPos({ top: rect.bottom + 6, left: Math.max(12, rect.right - 300), width: 300 });
      }
      setOpen(true);
    }
  }

  function pick(ev, identity) {
    if (ev) ev.stopPropagation();
    setOpen(false);
    if (onChange) onChange(identity);
  }

  return (
    <div className="combo-w">
      <button ref={triggerRef} className="btn btn-outline" onFocus={handleOpen} onClick={handleOpen} style={{ paddingLeft: 8 }}>
        <span className="avatar" style={{ background: current.color }}>{initials(current.nombre)}</span>
        <span className="text-left">

          <span className="block text-[10px] text-zinc-400 leading-none mt-0.5">{current.rol.replace("_", " ")}</span>
        </span>
        <Icon name="chevronDown" className="w-3.5 h-3.5" />

      {open && (
        <div className="combo-dd" style={{ top: pos.top, left: pos.left, width: pos.width }}>
          <div className="px-2.5 pt-1.5 pb-1 text-[11px] font-medium text-zinc-400 uppercase tracking-wide">Simular sesión SSO (OIDC)</div>
          {IDENTITIES.map(function (identity) {
            return (
              <div key={identity.email} className="combo-opt items-start" onClick={function (ev) { pick(ev, identity); }}>
                <span className="avatar mt-0.5" style={{ background: identity.color }}>{initials(identity.nombre)}</span>
                <span>
                  <span className="block font-medium">{identity.nombre}</span>
                  <span className="block text-[11px] text-zinc-500">{identity.email}</span>
                  <span className={"badge mt-1 " + (identity.rol === "OPERADOR" ? "badge-outline" : identity.rol === "APROBADOR" ? "badge-enproceso" : "badge-rechazado")}>
                    {identity.rol === "SIN_PERMISO" ? "SIN PERMISO (403)" : "Rol: " + identity.rol}
                  </span>
                </span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function fmtMonto(n) {
  if (typeof n !== "number" || isNaN(n)) return String(n);
  return "₡" + n.toLocaleString("es-CR", { maximumFractionDigits: 2 });
}

/* El usuario captura un Factor % (variación porcentual). El sistema la
   traduce al multiplicador que usa Softland: 10% → 1.10. No se admiten
   valores negativos: el Factor % siempre debe ser cero o positivo (0–100). */
function convertirPorcentajeAFactor(valor) {
  const crudo = String(valor == null ? "" : valor).trim().replace(",", ".");
  const porcentaje = parseFloat(crudo);
  const formatoValido = crudo !== "" && !isNaN(porcentaje) && /^-?\d+(\.\d+)?$/.test(crudo);
  const esNegativo = formatoValido && porcentaje < 0;
  const factor = formatoValido ? 1 + (porcentaje / 100) : null;
  const dentroDeRango = formatoValido && !esNegativo && factor > 0 && factor <= 2;
  return {
    valido: dentroDeRango,
    porcentaje: porcentaje,
    factor: factor,
    causa: !formatoValido
      ? "Formato de Factor % inválido / valor no numérico."
      : esNegativo
        ? "El Factor % no admite valores negativos. Ingrese un porcentaje entre 0 y 100."
        : "El Factor % debe estar entre 0 y 100 (multiplicador resultante mayor que 0 y menor o igual a 2).",
  };
}

function textoFactorCalculado(factor) {
  return factor != null && !isNaN(factor) ? factor.toFixed(2) : "—";
}

/* =========================================================================
   MOTOR DE VALIDACIÓN FILA POR FILA (reglas de negocio reales, no simuladas)
   modo "precio": el Excel trae el precio propuesto final.
   modo "factor": las filas ya contienen el factor multiplicador derivado
   de la variación porcentual capturada por el usuario.
   ========================================================================= */
function validarFila(row, modo) {
  const articulo = CATALOGO_ARTICULOS[row.codigo];

  if (!articulo) {
    return {
      valido: false,
      precioActual: null,
      precioPropuesto: null,
      margenEst: null,
      causa: "El código de artículo no existe en el catálogo activo.",
    };
  }

  const crudo = String(row.valorPropuestoRaw).trim().replace(",", ".");
  const numero = parseFloat(crudo);
  const esNumeroValido = crudo !== "" && !isNaN(numero) && /^-?\d+(\.\d+)?$/.test(crudo);

  if (!esNumeroValido) {
    return {
      valido: false,
      precioActual: articulo.precioActual,
      precioPropuesto: null,
      margenEst: null,
      causa: "Formato de celda inválido / valor no numérico.",
    };
  }

  if (modo === "factor") {
    if (numero <= 0 || numero > 2) {
      return {
        valido: false,
        precioActual: articulo.precioActual,
        precioPropuesto: Math.round(articulo.precioActual * numero),
        margenEst: null,
        causa: "El factor aplicado (" + numero + ") está fuera del rango permitido (mayor que 0 y menor o igual a 2).",
      };
    }
  }

  const precioPropuesto = modo === "factor" ? Math.round(articulo.precioActual * numero) : Math.round(numero);

  if (precioPropuesto <= 0) {
    return {
      valido: false,
      precioActual: articulo.precioActual,
      precioPropuesto: precioPropuesto,
      margenEst: null,
      causa: "El precio propuesto resultante debe ser mayor que cero.",
    };
  }

  if (precioPropuesto < articulo.costoReposicion) {
    const margenNegativo = ((precioPropuesto - articulo.costoReposicion) / precioPropuesto) * 100;
    return {
      valido: false,
      precioActual: articulo.precioActual,
      precioPropuesto: precioPropuesto,
      margenEst: margenNegativo,
      causa: "El precio propuesto (" + fmtMonto(precioPropuesto) + ") genera un margen de " + margenNegativo.toFixed(1) + "% por debajo del costo en Softland.",
    };
  }

  const margenEst = ((precioPropuesto - articulo.costoReposicion) / precioPropuesto) * 100;
  return { valido: true, precioActual: articulo.precioActual, precioPropuesto: precioPropuesto, margenEst: margenEst, causa: null };
}

function construirFilaCompleta(row, modo) {
  const articulo = CATALOGO_ARTICULOS[row.codigo];
  const validacion = validarFila(row, modo);
  return Object.assign({}, row, {
    descripcion: articulo ? articulo.descripcion : "— Código no encontrado —",
    validacion: validacion,
  });
}

function construirFilaDesdeVariacion(row, modo) {
  if (modo !== "factor") return construirFilaCompleta(row, modo);
  const conversion = convertirPorcentajeAFactor(row.variacionPorcentaje);
  const filaConFactor = Object.assign({}, row, {
    valorPropuestoRaw: conversion.valido ? textoFactorCalculado(conversion.factor) : "",
  });
  const fila = construirFilaCompleta(filaConFactor, modo);
  if (!conversion.valido && CATALOGO_ARTICULOS[row.codigo]) {
    return Object.assign({}, fila, {
      validacion: {
        valido: false,
        precioActual: CATALOGO_ARTICULOS[row.codigo].precioActual,
        precioPropuesto: null,
        margenEst: null,
        causa: conversion.causa,
      },
    });
  }
  return fila;
}

/* Parseo de la plantilla oficial XLSX. El proceso de descuento masivo exige
   Fila | Lista de Precio | Código Artículo | Factor; el usuario ingresa 10
   para +10% y el sistema persiste el multiplicador 1.10. */
function codigoListaDesdeArchivo(valor) {
  const crudo = String(valor == null ? "" : valor).trim().toLowerCase();
  return Object.keys(NOMBRES_LISTA).find(function (codigo) {
    return codigo === crudo || NOMBRES_LISTA[codigo].toLowerCase() === crudo;
  }) || null;
}

function construirFilaDescuentoMasivo(row) {
  const fila = construirFilaDesdeVariacion(row, "factor");
  const listaCodigo = codigoListaDesdeArchivo(row.listaCodigo);
  if (!listaCodigo) {
    return Object.assign({}, fila, {
      listaCodigo: null,
      lista: "—",
      validacion: Object.assign({}, fila.validacion, {
        valido: false,
        causa: "La lista de precio no existe o no tiene un formato válido en la plantilla.",
      }),
    });
  }
  return Object.assign({}, fila, { listaCodigo: listaCodigo, lista: NOMBRES_LISTA[listaCodigo] });
}

function parsearArchivoExcel(file, modo, procesoKey) {
  return new Promise(function (resolve, reject) {
    const reader = new FileReader();
    reader.onerror = function () { reject(new Error("No fue posible leer el archivo.")); };
    reader.onload = function (e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false });
        const dataRows = rows.slice(1).filter(function (r) { return r && r.length > 0; });
        const esDescuentoMasivo = procesoKey === "DESCUENTO_LISTA_PRECIO";
        const parsed = dataRows.map(function (r, idx) {
          const filaArchivo = {
            fila: (typeof r[0] === "number" ? r[0] : idx + 2),
            listaCodigo: esDescuentoMasivo && r[1] !== undefined ? String(r[1]).trim() : null,
            codigo: esDescuentoMasivo ? (r[2] !== undefined ? String(r[2]).trim() : "") : (r[1] !== undefined ? String(r[1]).trim() : ""),
            variacionPorcentaje: esDescuentoMasivo ? (r[3] !== undefined ? r[3] : "") : (r[2] !== undefined ? r[2] : ""),
            valorPropuestoRaw: esDescuentoMasivo ? (r[3] !== undefined ? r[3] : "") : (r[2] !== undefined ? r[2] : ""),
          };
          return esDescuentoMasivo ? construirFilaDescuentoMasivo(filaArchivo) : construirFilaDesdeVariacion(filaArchivo, modo);
        });
        resolve(parsed);
      } catch (err) {
        reject(err);
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

/* Plantilla oficial descargable para la carga masiva de descuento por lista y artículo. */
function descargarPlantillaExcel(procesoKey) {
  const esDescuentoMasivo = procesoKey === "DESCUENTO_LISTA_PRECIO";
  const encabezado = esDescuentoMasivo
    ? ["Fila", "Lista de Precio", "Codigo Articulo", "Factor %"]
    : ["Fila", "Codigo Articulo", "Factor %"];
  const filasEjemplo = esDescuentoMasivo
    ? [[1, "MAYOREOB", "ART-231", "10"], [2, "LPV1", "ART-455", "5"]]
    : [[1, "ART-231", "10"], [2, "ART-455", "10"]];
  const hoja = XLSX.utils.aoa_to_sheet([encabezado].concat(filasEjemplo));
  hoja["!cols"] = esDescuentoMasivo ? [{ wch: 8 }, { wch: 20 }, { wch: 18 }, { wch: 16 }] : [{ wch: 8 }, { wch: 18 }, { wch: 16 }];
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, "Plantilla");
  XLSX.writeFile(libro, "plantilla-" + procesoKey.toLowerCase() + ".xlsx");
}

   simulando la validación que aplicaría el backend). */
function estaEnAmbito(user, compania, listaCodigo) {
  if (!user) return false;
  if (compania && user.companiasPermitidas.indexOf(compania) === -1) return false;
  if (listaCodigo && user.listasPermitidas.indexOf(listaCodigo) === -1) return false;
  return true;
}

   "SP" (Stored Procedure); en su lugar se usa "PROC" (procesamiento). */
function nuevoIdProcesoSP() {
  const d = new Date();
  const yyyy = d.getFullYear(), mm = String(d.getMonth() + 1).padStart(2, "0"), dd = String(d.getDate()).padStart(2, "0");
  const rand = Math.floor(1000 + Math.random() * 8999);
  return "#PROC-" + yyyy + mm + dd + "-" + rand;

function nombreArchivoS3(prefijo, ext) {

function filasADataCsv(filas) {
  const header = ["Fila", "Codigo_Articulo", "Descripcion", "Factor_Porcentaje", "Factor_Aplicado", "Precio_Actual", "Precio_Propuesto", "Resultado", "Causa"];
  const lines = filas.map(function (f) {
    const v = f.validacion;
    return [
      f.fila, f.codigo, f.descripcion, f.variacionPorcentaje != null ? f.variacionPorcentaje : "", f.valorPropuestoRaw,
      v.precioActual != null ? v.precioActual : "",
      v.precioPropuesto != null ? v.precioPropuesto : "",
      v.valido ? "OK" : "ERROR",
      v.causa ? v.causa.replace(/"/g, "'") : "",
    ].map(function (val) { return '"' + String(val).replace(/"/g, "'") + '"'; }).join(",");
  });
  return [header.join(",")].concat(lines).join("\n");
}

function descargarTexto(nombre, contenido, mime) {
  const blob = new Blob([contenido], { type: mime || "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* =========================================================================
   TABLA DE PREVISUALIZACIÓN — compartida entre Operador y Aprobador
   Columnas: Fila Excel | Código Artículo | Lista | Descripción | Precio Actual |
   Factor % | Factor aplicado | Precio Propuesto | Margen Est. | Validación
   ========================================================================= */
function TablaPrevisualizacion({ filas, compacta }) {
  const UMBRAL_PAGINACION = 5000;
  const FILAS_POR_PAGINA = 100;
  const [paginaActual, setPaginaActual] = useState(1);
  const conError = filas.filter(function (f) { return !f.validacion.valido; }).length;
  const usaPaginacion = filas.length > UMBRAL_PAGINACION;
  const totalPaginas = usaPaginacion ? Math.ceil(filas.length / FILAS_POR_PAGINA) : 1;
  const paginaSegura = Math.min(paginaActual, totalPaginas);
  const inicio = usaPaginacion ? (paginaSegura - 1) * FILAS_POR_PAGINA : 0;
  const fin = usaPaginacion ? Math.min(inicio + FILAS_POR_PAGINA, filas.length) : filas.length;
  const filasVisibles = usaPaginacion ? filas.slice(inicio, fin) : filas;
  const erroresVisibles = filasVisibles.filter(function (f) { return !f.validacion.valido; });

  useEffect(function () {
    setPaginaActual(1);
  }, [filas]);

  return (
    <div>
      <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
        <p className="text-xs text-zinc-500">
          {filas.length} fila(s) evaluada(s){conError > 0 ? " · " + conError + " con hallazgo" : ""}
          {usaPaginacion ? " · Vista detallada paginada para carga masiva" : ""}
        </p>
        {usaPaginacion && (
          <p className="text-xs text-zinc-500 mono">Mostrando {inicio + 1}–{fin} de {filas.length} registros</p>
        )}
      </div>
      <div className="card overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-zinc-50 text-xs text-zinc-500">
            <tr>
              <th className="text-left font-medium px-3 py-2">Fila Excel</th>
              <th className="text-left font-medium px-3 py-2">Código Artículo</th>
              <th className="text-left font-medium px-3 py-2">Lista de Precio</th>
              <th className="text-left font-medium px-3 py-2">Descripción</th>
              <th className="text-right font-medium px-3 py-2">Precio Actual</th>
              <th className="text-right font-medium px-3 py-2">Factor %</th>
              <th className="text-right font-medium px-3 py-2">Factor aplicado</th>
              <th className="text-right font-medium px-3 py-2">Precio Propuesto</th>
              <th className="text-right font-medium px-3 py-2">Margen Est.</th>
              <th className="text-left font-medium px-3 py-2">Validación</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-zinc-100">
            {filasVisibles.map(function (f) {
              const v = f.validacion;
              return (
                <tr key={f.fila + "-" + f.codigo} className={!v.valido ? "row-alert" : ""}>
                  <td className="px-3 py-2 mono">{f.fila}</td>
                  <td className="px-3 py-2 mono">{f.codigo}</td>
                  <td className="px-3 py-2">{f.lista || "—"}</td>
                  <td className="px-3 py-2">{f.descripcion}</td>
                  <td className="px-3 py-2 text-right mono">{v.precioActual != null ? fmtMonto(v.precioActual) : "—"}</td>
                  <td className="px-3 py-2 text-right mono">{f.variacionPorcentaje != null && f.variacionPorcentaje !== "" ? f.variacionPorcentaje : "—"}</td>
                  <td className="px-3 py-2 text-right mono">{f.valorPropuestoRaw || "—"}</td>
                  <td className="px-3 py-2 text-right mono">{v.precioPropuesto != null ? fmtMonto(v.precioPropuesto) : "—"}</td>
                  <td className={"px-3 py-2 text-right " + (v.margenEst != null && v.margenEst < 0 ? "text-red-700 font-medium" : "")}>
                    {v.margenEst != null ? v.margenEst.toFixed(1) + "%" : "—"}
                  </td>
                  <td className="px-3 py-2">
                    {v.valido
                      ? <span className="badge badge-ok"><Icon name="check" className="w-3 h-3" /> Válida</span>
                      : <span className="badge badge-costo" title={v.causa}><Icon name="alertTriangle" className="w-3 h-3" /> Con hallazgo</span>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {usaPaginacion && (
        <div className="mt-3 flex items-center justify-between gap-3 flex-wrap">
          <p className="text-xs text-zinc-500">Página {paginaSegura} de {totalPaginas} · {FILAS_POR_PAGINA} registros por página</p>
          <div className="flex items-center gap-2">
            <button type="button" className="btn btn-outline" disabled={paginaSegura === 1}
              onClick={function () { setPaginaActual(function (p) { return Math.max(1, p - 1); }); }}>
              Anterior
            </button>
            <button type="button" className="btn btn-outline" disabled={paginaSegura === totalPaginas}
              onClick={function () { setPaginaActual(function (p) { return Math.min(totalPaginas, p + 1); }); }}>
              Siguiente
            </button>
          </div>
        </div>
      )}
      {!compacta && conError > 0 && (
        <div className="mt-3 rounded-lg bg-red-50 border border-red-200 px-4 py-3">
          <p className="text-xs font-semibold text-red-800 mb-1.5">
            {usaPaginacion ? "Hallazgos de la página actual:" : "Detalle de hallazgos encontrados en la previsualización:"}
          </p>
          <ul className="text-xs text-red-700 space-y-1">
            {erroresVisibles.map(function (f) {
              return <li key={f.fila}>Fila {f.fila} [{f.codigo}]: {f.validacion.causa}</li>;
            })}
          </ul>
        </div>
      )}
    </div>
  );
}

/* =========================================================================
   ZONA DE CARGA DE ARCHIVO XLSX (simulación de subida a S3)
   ========================================================================= */
function ExcelUploader({ disabled, modo, procesoKey, onParsed, onError }) {
  const [drag, setDrag] = useState(false);
  const [fileName, setFileName] = useState(null);
  const [s3Key, setS3Key] = useState(null);
  const [loading, setLoading] = useState(false);
  const inputRef = useRef(null);

  function procesar(file) {
    if (!file) return;
    const ext = file.name.split(".").pop().toLowerCase();
    if (ext !== "xlsx") {
      onError("Formato no soportado. Suba únicamente la plantilla oficial .xlsx.");
      return;
    }
    setLoading(true);
    setFileName(file.name);
    parsearArchivoExcel(file, modo, procesoKey).then(function (filas) {
      const key = "erp-precios-uploads/" + nombreArchivoS3("carga", ext);
      setS3Key(key);
      setLoading(false);
      onParsed(filas, file.name, key);
    }).catch(function () {
      setLoading(false);
      onError("No fue posible leer el archivo. Verifique que respete el formato de la plantilla oficial.");
    });
  }

  function handleDrop(e) {
    e.preventDefault();
    setDrag(false);
    if (disabled) return;
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    procesar(file);
  }

  return (
    <div>
      <div
        className={"dropzone" + (drag ? " drag" : "") + (disabled ? " opacity-50 pointer-events-none" : "")}
        onDragOver={function (e) { e.preventDefault(); setDrag(true); }}
        onDragLeave={function () { setDrag(false); }}
        onDrop={handleDrop}
        onClick={function () { if (!disabled && inputRef.current) inputRef.current.click(); }}
      >
        <input ref={inputRef} type="file" accept=".xlsx" className="hidden" disabled={disabled}
          onChange={function (e) { procesar(e.target.files && e.target.files[0]); }} />
        <Icon name="upload" className="w-6 h-6 mx-auto mb-2 text-zinc-400" />
        {loading ? (
          <p className="text-sm text-zinc-500 flex items-center justify-center gap-2"><Icon name="loader" className="w-4 h-4" spin /> Leyendo archivo…</p>
        ) : fileName ? (
          <div>
            <p className="text-sm font-medium text-zinc-700 flex items-center justify-center gap-1.5"><Icon name="fileSpreadsheet" className="w-4 h-4" /> {fileName}</p>
            {s3Key && <p className="s3-tag mt-1 mono">s3://erp-precios-uploads/{s3Key.split("/")[1]}</p>}
            <p className="text-xs text-zinc-400 mt-1">Haga clic para reemplazar el archivo.</p>
          </div>
        ) : (
          <div>
            <p className="text-sm font-medium text-zinc-700">Arrastre aquí su plantilla, o haga clic para seleccionarla</p>
            <p className="text-xs text-zinc-400 mt-1">Formato admitido: .xlsx según la plantilla oficial del proceso</p>
          </div>
        )}
      </div>
    </div>
  );
}

/* =========================================================================
   PANTALLA: NUEVA SOLICITUD (OPERADOR) — con soporte de solo-lectura
   "Gestión Global" se captura manualmente por lista y factor. "Actualización
   Masiva de Precios" actualiza exclusivamente la lista base configurada por
   Grupo de Artículos y versión aprobada. "Descuento por Artículo" permite captura
   manual o carga masiva XLSX por lista, artículo y factor. Las cargas son
   variables —incluidas cargas de hasta 12,000 registros— y, al superar 5,000
   filas, se muestran paginadas en la previsualización para no sobrecargar la interfaz.

   Ámbito (RF-02 / RF-03): toda opción de Compañía y Lista de Precio se
   filtra según companiasPermitidas/listasPermitidas del usuario actual, y
   el envío se bloquea de forma defensiva si algún valor quedara fuera de
   ámbito (equivalente a la validación que debe repetir el backend).
   ========================================================================= */
function NuevaSolicitud({ readOnly, currentUser, onSubmit }) {
  const [tab, setTab] = useState("FACTOR_PRECIO");
  const [modalidad, setModalidad] = useState("manual"); // manual | excel
  const [compania, setCompania] = useState("");
  const [nivel, setNivel] = useState("");
  const [codigoArticulo, setCodigoArticulo] = useState("");
  const [grupoArticulo, setGrupoArticulo] = useState("");
  const [nivelLista, setNivelLista] = useState(""); // reservado para edición manual de lista
  const [factor, setFactor] = useState("");
  const [itemsManual, setItemsManual] = useState([]); // artículos o listas agregados uno a uno con "+"
  const [errorItem, setErrorItem] = useState(null);
  const [ack, setAck] = useState(false);
  const [simulado, setSimulado] = useState(false);
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);
  const [filasExcel, setFilasExcel] = useState(null);
  const [archivoNombre, setArchivoNombre] = useState(null);
  const [archivoS3Key, setArchivoS3Key] = useState(null);
  const [errorCarga, setErrorCarga] = useState(null);
  // Filtros de búsqueda de artículos (Categoría/Subcategoría, Grupo, Marca,
  // Marca Grupo Compra, BDF). Aplican sobre el catálogo antes de mostrar las
  // opciones del combobox "Código de Artículo" en Descuento por Artículo.
  const [filtroCategoria, setFiltroCategoria] = useState("");
  const [filtroSubcategoria, setFiltroSubcategoria] = useState("");
  const [filtroGrupo, setFiltroGrupo] = useState("");
  const [filtroMarca, setFiltroMarca] = useState("");
  const [filtroMarcaGrupoCompra, setFiltroMarcaGrupoCompra] = useState("");
  const [filtroBdf, setFiltroBdf] = useState("");

  const companiaOpts = COMPANIAS.map(function (c) {
    return { value: c, label: c, disabled: !estaEnAmbito(currentUser, c, null) };
  });
  // Las listas de precio disponibles dependen de la Compañía seleccionada
  // (LISTAS_POR_COMPANIA) y, además, del ámbito autorizado del usuario.
  // La lista de precios depende obligatoriamente de la compañía. Antes de
  // seleccionarla no se expone ningún listado, evitando cruces de catálogos.
  const listasDeCompania = compania ? (LISTAS_POR_COMPANIA[compania] || []) : [];
  const nivelOptsBase = listasDeCompania.map(function (codigo) {
    return { value: codigo, label: NOMBRES_LISTA[codigo] || codigo };
  });
  const nivelOpts = nivelOptsBase.filter(function (o) { return estaEnAmbito(currentUser, null, o.value); });
  // MAYOREOD es la Lista Base y solo se gestiona desde Actualización Masiva
  // de Precios (MAYOREOD_MASIVO); se excluye del selector tanto en Gestión
  // Global como en Descuento por Artículo.
  const nivelOptsSinListaBase = nivelOpts.filter(function (o) { return o.value !== "mayoreod"; });
  const articulosFiltrados = Object.keys(CATALOGO_ARTICULOS).filter(function (cod) {
    const art = CATALOGO_ARTICULOS[cod];
    if (filtroCategoria && art.categoria !== filtroCategoria) return false;
    if (filtroSubcategoria && art.subcategoria !== filtroSubcategoria) return false;
    if (filtroGrupo && art.grupo !== filtroGrupo) return false;
    if (filtroMarca && art.marca !== filtroMarca) return false;
    if (filtroMarcaGrupoCompra && art.marcaGrupoCompra !== filtroMarcaGrupoCompra) return false;
    if (filtroBdf && art.bdf !== filtroBdf) return false;
    return true;
  });
  const articuloOpts = articulosFiltrados.map(function (cod) {
    return { value: cod, label: cod + " — " + CATALOGO_ARTICULOS[cod].descripcion };
  });
  const grupoArticuloOpts = Object.keys(GRUPOS_ARTICULOS).map(function (codigo) {
    return { value: codigo, label: GRUPOS_ARTICULOS[codigo].label + " (" + GRUPOS_ARTICULOS[codigo].articulos.length + " artículos)" };
  });

  useEffect(function () {
    // Cambiar de compañía puede invalidar la lista seleccionada (cada
    // compañía habilita un conjunto distinto de listas de precio).
    if (nivel && listasDeCompania.indexOf(nivel) === -1) setNivel("");
  }, [compania]);

  useEffect(function () {
    setSimulado(false);
    setSent(false);
    setFilasExcel(null);
    setArchivoNombre(null);
    setArchivoS3Key(null);
    setErrorCarga(null);
    setItemsManual([]);
    setErrorItem(null);
    setGrupoArticulo("");
    setModalidad("manual");
    // Ni Gestión Global ni Descuento por Artículo gestionan la Lista Base
    // (MAYOREOD); si venía seleccionada desde otra pestaña, se limpia para
    // evitar un valor seleccionado que ya no aparece entre las opciones visibles.
    if ((tab === "FACTOR_PRECIO" || tab === "DESCUENTO_LISTA_PRECIO") && nivel === "mayoreod") setNivel("");
  }, [tab]);

  useEffect(function () {
    setSimulado(false);
    setSent(false);
  }, [compania, nivel, codigoArticulo, grupoArticulo, nivelLista, factor, ack, modalidad, itemsManual]);

  const conversionFactor = convertirPorcentajeAFactor(factor);
  const factorMultiplicador = conversionFactor.valido ? conversionFactor.factor : null;
  const factorInvalido = factor !== "" && !conversionFactor.valido;
  const modo = PROCESOS[tab].modo;
  const esDescuentoArticulo = tab === "DESCUENTO_LISTA_PRECIO";
  const esListaBase = tab === "MAYOREOD_MASIVO";
  const esGestionGlobal = tab === "FACTOR_PRECIO";
  const articuloSeleccionado = esDescuentoArticulo ? CATALOGO_ARTICULOS[codigoArticulo] : null;
  const grupoSeleccionado = esListaBase ? GRUPOS_ARTICULOS[grupoArticulo] : null;
  // En Descuento por Artículo, la clave funcional es Artículo + Lista de
  // Precio: un mismo artículo puede configurarse en listas diferentes.
  const articulosListaYaAgregados = itemsManual.map(function (it) { return it.codigo + "|" + it.listaCodigo; });

  // MAYOREOD es exclusivo de la Lista Base; la carga masiva pertenece a Descuento por Artículo.
  const permiteExcel = esDescuentoArticulo;
  const companiaFueraDeAmbito = !!compania && !estaEnAmbito(currentUser, compania, null);
  const listaFueraDeAmbito = !!nivel && !estaEnAmbito(currentUser, null, nivel);
  const conteoErroresExcel = filasExcel ? filasExcel.filter(function (f) { return !f.validacion.valido; }).length : 0;
  const filasExcelFueraDeAmbito = esDescuentoArticulo && modalidad === "excel" && filasExcel && filasExcel.some(function (f) {
    return !f.listaCodigo || !estaEnAmbito(currentUser, null, f.listaCodigo);
  });

  function agregarItem() {
    const conversionItem = convertirPorcentajeAFactor(factor);
    const claveArticuloLista = codigoArticulo + "|" + nivel;
    if (!codigoArticulo || !nivel || factorInvalido || factor === "") return;
    if (articulosListaYaAgregados.indexOf(claveArticuloLista) !== -1) {
      setErrorItem("El artículo " + codigoArticulo + " ya fue agregado para la lista " + (NOMBRES_LISTA[nivel] || nivel) + ".");
      return;
    }
    setErrorItem(null);
    setItemsManual(function (list) {
      return list.concat([{
        fila: list.length + 1,
        codigo: codigoArticulo,
        listaCodigo: nivel,
        lista: NOMBRES_LISTA[nivel] || nivel,
        variacionPorcentaje: conversionItem.porcentaje,
        valorPropuestoRaw: textoFactorCalculado(conversionItem.factor),
      }]);
    });
    setCodigoArticulo("");
    setFactor("");
  }

  function quitarItem(codigo, listaCodigo) {
    setItemsManual(function (list) {
      return list.filter(function (it) { return it.codigo !== codigo || it.listaCodigo !== listaCodigo; }).map(function (it, idx) { return Object.assign({}, it, { fila: idx + 1 }); });
    });
  }

  function camposManualCompletos() {
    if (!compania || companiaFueraDeAmbito) return false;
    if (esListaBase) return !!grupoArticulo && !factorInvalido && factor !== "" && ack;
    if (esDescuentoArticulo) return itemsManual.length > 0 && !!nivel && !listaFueraDeAmbito;
    return !!nivel && !factorInvalido && factor !== "" && !listaFueraDeAmbito;
  }

  function camposCompletos() {
    if (modalidad === "excel" && permiteExcel) {
      return !!filasExcel && filasExcel.length > 0 && conteoErroresExcel === 0 && !filasExcelFueraDeAmbito && !!compania && !companiaFueraDeAmbito;
    }
    return camposManualCompletos();
  }

  function puedeEnviar() {
    return simulado && camposCompletos() && !readOnly;
  }

  function handleSimular() {
    if (!camposCompletos()) return;
    if (modalidad === "manual") {
      if (esListaBase) {
        setFilasExcel(construirFilasMayoreodMasivo(grupoArticulo, textoFactorCalculado(factorMultiplicador), conversionFactor.porcentaje));
      } else if (esDescuentoArticulo) {
        // Carga individual: cada fila corresponde a un artículo agregado con
        // "+", con los mismos campos que persistirá dbo.DESCUENTO_LISTA_PRECIO.
        setFilasExcel(itemsManual.map(function (it) { return construirFilaCompleta(it, modo); }));
      } else if (esGestionGlobal) {
        setFilasExcel(construirFilasGestionGlobal(nivel, textoFactorCalculado(factorMultiplicador), conversionFactor.porcentaje));
      }
    }
    setSimulado(true);
  }

  function handleArchivoParsed(filas, nombre, s3Key) {
    const filasValidadas = esDescuentoArticulo ? filas.map(function (fila) {
      if (fila.listaCodigo === "mayoreod") {
        return Object.assign({}, fila, {
          validacion: Object.assign({}, fila.validacion, {
            valido: false,
            causa: "La Lista Base (MAYOREOD) no se gestiona desde Descuento por Artículo; use Actualización Masiva de Precios.",
          }),
        });
      }
      if (fila.listaCodigo && estaEnAmbito(currentUser, null, fila.listaCodigo)) return fila;
      return Object.assign({}, fila, {
        validacion: Object.assign({}, fila.validacion, {
          valido: false,
          causa: "La lista de precio de esta fila no está dentro de su ámbito autorizado.",
        }),
      });
    }) : filas;
    setFilasExcel(filasValidadas);
    setArchivoNombre(nombre);
    setArchivoS3Key(s3Key);
    setErrorCarga(null);
    setSimulado(false);
  }

  function resetFormulario() {
    setSent(false);
    setSimulado(false);
    setFactor("");
    setCodigoArticulo("");
    setGrupoArticulo("");
    setNivelLista("");
    setAck(false);
    setFilasExcel(null);
    setArchivoNombre(null);
    setArchivoS3Key(null);
    setItemsManual([]);
    setErrorItem(null);
  }

  function handleEnviar() {
    if (!puedeEnviar() || sending) return;
    // Validación defensiva de ámbito (RF-03): la interfaz nunca debe poder
    // enviar una solicitud fuera del ámbito autorizado del usuario, incluso
    // si el estado del formulario quedara inconsistente.
    if (!estaEnAmbito(currentUser, compania, esDescuentoArticulo && modalidad === "manual" ? nivel : null) || filasExcelFueraDeAmbito) {
      setErrorItem("Esta solicitud está fuera de su ámbito autorizado (compañía o lista). No puede enviarse.");
      return;
    }
    setSending(true);
    setTimeout(function () {
      onSubmit({
        proceso: tab,
        modalidad: modalidad,
        compania: compania,
        parametros: {
          nivel: nivel,
          factor: (esGestionGlobal || esListaBase) && factorMultiplicador != null ? textoFactorCalculado(factorMultiplicador) : null,
          variacionPorcentaje: (esGestionGlobal || esListaBase) && factor !== "" ? conversionFactor.porcentaje : null,
          listaBase: esListaBase ? LISTA_BASE_OBJETIVO.codigo : null,
          nivelPrecio: esListaBase ? LISTA_BASE_OBJETIVO.nivelPrecio : null,
          grupoArticulos: esListaBase ? grupoArticulo : null,
          articulos: esDescuentoArticulo ? (modalidad === "excel" ? filasExcel : itemsManual) : null,
        },
        filas: filasExcel || [],
        archivoNombre: archivoNombre,
        archivoS3Key: archivoS3Key,
      });
      setSending(false);
      setSent(true);
      setTimeout(resetFormulario, 1300);
    }, 850);
  }

      {modalidad === "manual" && esDescuentoArticulo && (

          <div className="combo-parent">
            <div className="rounded-lg border border-zinc-200 p-3 mb-3">
              <p className="text-[11px] font-medium text-zinc-500 mb-2">Filtrar artículos por</p>

                  <label className="block text-[11px] text-zinc-400 mb-1">Subcategoría</label>

                <div>
                  <label className="block text-[11px] text-zinc-400 mb-1">Grupo</label>

                    options={[{ value: "", label: "Todos" }].concat(FILTROS_ARTICULOS.grupo.map(function (v) { return { value: v, label: v }; }))}

          {itemsManual.length > 0 && (

                      <th className="text-right font-medium px-3 py-2">Factor %</th>

                  </thead>
                  <tbody className="divide-y divide-zinc-100">
                    {itemsManual.map(function (it, idx) {

                      return (

      {modalidad === "manual" && esListaBase && (

            <p className="font-semibold">⚠️ Atención: esta actualización aplicará cambios sobre la Lista Base ({LISTA_BASE_OBJETIVO.nombre} / {LISTA_BASE_OBJETIVO.codigo}) cuando sea autorizada.</p>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-2xl">
            <div>
              <label className="block text-xs font-medium text-zinc-500 mb-1.5">Grupo de Artículos</label>
              <Combobox id="grupo-articulos-mayoreod" value={grupoArticulo} onChange={function (o) { setGrupoArticulo(o.value); setErrorItem(null); }} options={grupoArticuloOpts} placeholder="Seleccionar grupo..." disabled={readOnly} />

            <div>
              <label className="block text-xs font-medium text-zinc-500 mb-1.5">Factor %</label>
              <input type="number" step="0.01" min="0" max="100" value={factor} disabled={readOnly}
                onChange={function (e) { setFactor(e.target.value); }}
                placeholder="Ej. 10"
                className="w-full text-sm px-3 py-2 rounded-lg border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-zinc-900/10 focus:border-zinc-900 disabled:bg-zinc-50 disabled:text-zinc-400" />

              {!factorInvalido && factor !== "" && <p className="text-[11px] text-zinc-500 mt-1">Factor aplicado: <b className="mono">{textoFactorCalculado(factorMultiplicador)}</b></p>}
              {factorInvalido && <p className="text-[11px] text-red-600 mt-1 flex items-center gap-1"><Icon name="alertTriangle" className="w-3 h-3" /> {conversionFactor.causa}</p>}
            </div>
          </div>
          {grupoSeleccionado && (
            <div className="grid grid-cols-3 gap-3 max-w-2xl">
              <div className="card p-2.5"><p className="text-[10px] text-zinc-400">Lista objetivo</p><p className="text-xs font-medium mono">{LISTA_BASE_OBJETIVO.nombre} / {LISTA_BASE_OBJETIVO.nivelPrecio}</p></div>
              <div className="card p-2.5"><p className="text-[10px] text-zinc-400">Validación de versión</p><p className="text-xs font-medium">{LISTA_BASE_OBJETIVO.versionEstado} (automática)</p></div>
              <div className="card p-2.5"><p className="text-[10px] text-zinc-400">Artículos del grupo</p><p className="text-xs font-medium">{grupoSeleccionado.articulos.length}</p></div>
            </div>
          )}
          {errorItem && <p className="text-[11px] text-red-600">{errorItem}</p>}
          <label className="flex items-start gap-3 rounded-lg border border-zinc-200 p-3 cursor-pointer select-none max-w-xl">
            <input type="checkbox" checked={ack} disabled={readOnly} onChange={function (e) { setAck(e.target.checked); }} className="mt-0.5 h-4 w-4" />
            <span className="text-sm">Entiendo que esta solicitud aplicará cambios sobre {LISTA_BASE_OBJETIVO.nombre} / {LISTA_BASE_OBJETIVO.nivelPrecio} para el grupo seleccionado cuando un aprobador la autorice.</span>
          </label>
        </div>
      )}

      {modalidad === "excel" && permiteExcel && (
        <div className="space-y-4 mb-4">
          <div className="rounded-lg bg-zinc-50 border border-zinc-200 px-4 py-2.5 flex items-center justify-between flex-wrap gap-2">
            <p className="text-xs text-zinc-600 flex items-center gap-1.5">
              <Icon name="fileSpreadsheet" className="w-3.5 h-3.5 text-zinc-400" />
              ¿Aún no tiene el archivo? Descargue la plantilla oficial con Lista de Precio, Código de Artículo y Factor %. El sistema convierte el Factor % a multiplicador y valida cada fila antes de permitir el envío; no se admiten valores negativos.
            </p>
            <button type="button" className="btn btn-outline" onClick={function () { descargarPlantillaExcel(tab); }}>
              <Icon name="download" className="w-3.5 h-3.5" /> Descargar plantilla ({PROCESOS[tab].label})
            </button>
          </div>
          <ExcelUploader disabled={readOnly} modo={modo} procesoKey={tab} onParsed={handleArchivoParsed} onError={setErrorCarga} />
          {errorCarga && <p className="text-[11px] text-red-600">{errorCarga}</p>}
          {conteoErroresExcel > 0 && (
            <div className="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-xs text-red-800">
              La carga contiene {conteoErroresExcel} fila(s) inválida(s). Corrija y cargue nuevamente el archivo: el lote completo queda bloqueado antes de enviarse a aprobación.
            </div>
          )}
        </div>
      )}

      <div className="flex items-center justify-end gap-2 pt-3 border-t border-zinc-100">
        <button className="btn btn-outline" disabled={readOnly || !camposCompletos()} onClick={handleSimular}>
          <Icon name="search" className="w-3.5 h-3.5" /> {modalidad === "excel" && permiteExcel ? "Precalcular impacto" : "Simular impacto"}
        </button>
        <button
          className={"btn " + (esListaBase ? "btn-destructive" : "btn-default")}
          disabled={!puedeEnviar() || sending}
          onClick={handleEnviar}
        >
          {sending ? (<><Icon name="loader" className="w-3.5 h-3.5" spin /> Enviando…</>)
            : sent ? (<><Icon name="check" className="w-3.5 h-3.5" /> Enviado</>)
            : "Enviar a Aprobación"}
        </button>
      </div>

      {filasExcel && filasExcel.length > 0 && (
        <div className="mt-6 pt-5 border-t border-zinc-100">
          <div className="flex items-center gap-2 mb-2">
            <Icon name="search" className="w-4 h-4 text-zinc-500" />
            <h3 className="text-sm font-semibold">🔍 Previsualización de Impacto (Muestra Representativa / Diff)</h3>
          </div>
          <div className="rounded-lg bg-green-50 border border-green-200 px-4 py-2.5 text-xs text-green-800 mb-3 flex items-center gap-2">
            <Icon name="check" className="w-3.5 h-3.5" />
            ✅ Simulación completada sobre una muestra representativa / filas del archivo. Revise los valores resultantes antes de continuar.
          </div>
          <TablaPrevisualizacion filas={filasExcel} compacta={false} />
        </div>
      )}
    </div>
  );
}

              <th className="text-left font-medium px-4 py-2.5">Fecha</th>
              <th className="text-left font-medium px-4 py-2.5">Estado</th>
              <th className="text-left font-medium px-4 py-2.5">Detalle</th>

                <tr key={s.id}>
                  <td className="px-4 py-2.5 mono">{s.id}</td>
                  <td className="px-4 py-2.5"><span className="badge badge-outline">{PROCESOS[s.proceso].label}</span></td>
                  <td className="px-4 py-2.5 text-zinc-500">{s.compania}</td>
                  <td className="px-4 py-2.5 text-zinc-500">{s.fechaEnvio}</td>

                </tr>
              );
            })}

        </table>
      )}
    </div>
  );

/* =========================================================================
   BANDEJA DE APROBACIÓN
   ========================================================================= */
function BandejaAprobacion({ solicitudes, currentUser, readOnly, onAbrir }) {
  const estadoOpts = [
    { value: "Todos", label: "Todos" },
    { value: "PENDIENTE", label: "Pendiente de aprobación" },
    { value: "EN_PROCESO", label: "En proceso" },
    { value: "PROCESADO", label: "Procesado" },
    { value: "PROCESADO_CON_ERRORES", label: "Procesado con errores" },
    { value: "RECHAZADO", label: "Rechazado" },
    { value: "ERROR_EJECUCION", label: "Error de ejecución" },
  ];
  const procesoOpts = [{ value: "Todos", label: "Todos" }].concat(
    Object.keys(PROCESOS).map(function (k) { return { value: k, label: PROCESOS[k].label }; })
  );

  const [fEstado, setFEstado] = useState("Todos");
  const [fProceso, setFProceso] = useState("Todos");

  const filtradas = solicitudes.filter(function (s) {
    const okEstado = fEstado === "Todos" || s.estado === fEstado;
    const okProceso = fProceso === "Todos" || s.proceso === fProceso;
    const okAmbito = estaEnAmbito(currentUser, s.compania, null);
    return okEstado && okProceso && okAmbito;
  });

  return (
    <div>

/* =========================================================================
   MODAL: REVISIÓN -> EN PROCESO -> RESULTADO CON DESGLOSE FILA POR FILA

function RevisionModal({ solicitud, currentUser, onClose, onRechazar, onIniciarEjecucion, onSimularSolicitud }) {
  const [motivo, setMotivo] = useState("");
  const [filasSimuladasComoSolicitante, setFilasSimuladasComoSolicitante] = useState(null);
  const [simulacionConfirmada, setSimulacionConfirmada] = useState(false);
  const overlayRef = useRef(null);

  if (!solicitud) return null;

  const filasOriginales = solicitud.filas && solicitud.filas.length > 0 ? solicitud.filas : filasEjemploExcel(PROCESOS[solicitud.proceso].modo);
  const filas = filasSimuladasComoSolicitante || filasOriginales;
  const parametros = solicitud.parametros || {};
  const esActualizacionListaBase = solicitud.proceso === "MAYOREOD_MASIVO";
  const grupoArticulo = esActualizacionListaBase ? GRUPOS_ARTICULOS[parametros.grupoArticulos] : null;
  const puedeDecidir = currentUser.rol === "APROBADOR" && solicitud.estado === "PENDIENTE" && solicitud.solicitanteEmail !== currentUser.email;
  const puedeAprobar = puedeDecidir && simulacionConfirmada;
  const filasConHallazgo = filas.filter(function (f) { return !f.validacion.valido; });
  const estaEnProceso = solicitud.estado === "EN_PROCESO";
  const resultado = solicitud.resultado || null;

  function handleOverlayClick(ev) {
    if (!ev || !ev.target || ev.target !== overlayRef.current) return;
    onClose();
  }

  function simularComoSolicitante() {
    if (!puedeDecidir) return;
    const simulacion = filasOriginales.map(function (fila) {
      const recalculada = construirFilaCompleta({
        fila: fila.fila,
        codigo: fila.codigo,
        variacionPorcentaje: fila.variacionPorcentaje,
        valorPropuestoRaw: fila.valorPropuestoRaw,
      }, PROCESOS[solicitud.proceso].modo);
      return Object.assign({}, fila, recalculada);
    });
    setFilasSimuladasComoSolicitante(simulacion);
    setSimulacionConfirmada(true);
    if (onSimularSolicitud) onSimularSolicitud(solicitud.id);
  }

  function iniciarEjecucion() {
    if (!puedeAprobar) return;
    onIniciarEjecucion(solicitud.id, filas);
    onClose();
  }

  function descargarLogAuditoria() {
    if (!resultado) return;
    descargarTexto(nombreArchivoS3("log-auditoria-" + solicitud.id, "csv"), filasADataCsv(resultado.filas));
  }

  function descargarSoloFallidas() {
    if (!resultado) return;
    const soloFallidas = resultado.filas.filter(function (f) { return !f.validacion.valido; });
    descargarExcelFilas(nombreArchivoS3("filas-a-corregir-" + solicitud.id, "xlsx"), soloFallidas);
  }

  return (
    <div className="modal-overlay" ref={overlayRef} onClick={handleOverlayClick}>
      <div className="modal-box" onClick={function (e) { e.stopPropagation(); }}>
        <div className="p-6 border-b border-zinc-100 flex items-start justify-between gap-4">
          <div>
            <div className="flex items-center gap-2 mb-1 flex-wrap">
              <h2 className="text-lg font-semibold">Detalle de solicitud — <span className="mono">{solicitud.id}</span></h2>
              <span className="badge badge-outline">{PROCESOS[solicitud.proceso].label}</span>
              <EstadoBadge estado={solicitud.estado} />
            </div>
            <p className="text-xs text-zinc-500">Solicitante: <b>{solicitud.solicitanteNombre}</b> · Compañía: <b>{solicitud.compania}</b> · Enviado: {solicitud.fechaEnvio}</p>
            {solicitud.archivoNombre && <p className="text-xs text-zinc-400 mt-1 flex items-center gap-1"><Icon name="fileSpreadsheet" className="w-3.5 h-3.5" /> Plantilla: {solicitud.archivoNombre}</p>}
          </div>
          <button className="btn btn-ghost" onClick={onClose}><Icon name="x" className="w-4 h-4" /></button>
        </div>

        <div className="p-6 space-y-5">
          {estaEnProceso && (
            <div className="rounded-lg border border-indigo-200 bg-indigo-50 p-4 flex gap-3">
              <span className="text-indigo-600 mt-0.5"><Icon name="clock" className="w-5 h-5" /></span>
              <div>
                <p className="text-sm font-semibold text-indigo-900">La solicitud se está procesando en segundo plano</p>
                <p className="text-xs text-indigo-800 mt-1">ID de procesamiento: <span className="mono font-medium">{solicitud.idProcesoSP}</span>. Puede cerrar este detalle, navegar o salir del sistema. La solicitud cambiará automáticamente a Procesada, Procesada con errores o Error de ejecución al finalizar.</p>
                <div className="progress-track mt-3"><div className="progress-fill progress-indeterminate"></div></div>
                <p className="text-xs text-indigo-700 mt-2">Última consulta: {solicitud.ultimaActualizacion || "recién iniciada"}</p>
              </div>
            </div>
          )}

          <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div className="card p-3"><p className="text-[11px] text-zinc-400">Filas evaluadas</p><p className="text-lg font-semibold">{filas.length}</p></div>
            <div className="card p-3"><p className="text-[11px] text-zinc-400">Con hallazgo</p><p className="text-lg font-semibold text-red-600">{filasConHallazgo.length}</p></div>
            <div className="card p-3"><p className="text-[11px] text-zinc-400">Modalidad</p><p className="text-sm font-semibold">{solicitud.modalidad === "excel" ? "Plantilla Excel" : "Captura manual"}</p></div>
            <div className="card p-3"><p className="text-[11px] text-zinc-400">Ejecución</p><p className="text-sm font-semibold">{PROCESOS[solicitud.proceso].ejecucion}</p></div>
          </div>

          {esActualizacionListaBase && (
            <div className="rounded-lg border border-red-200 bg-red-50 p-4">
              <p className="text-xs font-semibold text-red-800 mb-3">Resumen para autorizar la ejecución sobre la Lista Base</p>
              <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Lista Base</p><p className="text-sm font-semibold">{LISTA_BASE_OBJETIVO.nombre} / {parametros.listaBase || LISTA_BASE_OBJETIVO.codigo}</p></div>
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Nivel de precio</p><p className="text-sm font-semibold">{parametros.nivelPrecio || LISTA_BASE_OBJETIVO.nivelPrecio}</p></div>
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Grupo de artículos</p><p className="text-sm font-semibold">{grupoArticulo ? grupoArticulo.label : "No especificado"}</p></div>
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Factor aplicado</p><p className="text-sm font-semibold mono">{parametros.factor || "—"}</p></div>
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Registros impactados</p><p className="text-sm font-semibold">{filas.length}</p></div>
              </div>
            </div>
          )}

          {puedeDecidir && (
            <div className={"rounded-lg border px-4 py-3 text-xs " + (simulacionConfirmada ? "border-green-200 bg-green-50 text-green-800" : "border-zinc-200 bg-zinc-50 text-zinc-600")}>
              <div className="flex items-center justify-between gap-3 flex-wrap">
                <div>
                  <p className="font-semibold">Simulación con los parámetros del Solicitante</p>
                  <p className="mt-1">{simulacionConfirmada ? "Simulación completada con los parámetros enviados por " + solicitud.solicitanteNombre + ". Puede tomar la decisión." : "Antes de aprobar, simule el impacto con los parámetros enviados por " + solicitud.solicitanteNombre + " (rol Solicitante)."}</p>
                </div>
                <button className="btn btn-outline" onClick={simularComoSolicitante}><Icon name="refreshCw" className="w-3.5 h-3.5" /> {simulacionConfirmada ? "Simular nuevamente" : "Simular como solicitante"}</button>
              </div>
            </div>
          )}

          <TablaPrevisualizacion filas={filas} compacta={false} />

          {resultado && (
            <React.Fragment>
              <div className="flex items-center gap-2 mb-2 flex-wrap">
                <Icon name="fileWarning" className="w-4 h-4 text-zinc-500" />
                <p className="text-sm font-semibold">Resultado final del procesamiento</p>
                <span className={"badge " + (resultado.estadoFinal === "PROCESADO" ? "badge-ok" : resultado.estadoFinal === "PROCESADO_CON_ERRORES" ? "badge-costo" : "badge-error")}>
                  {textoResultadoAuditoria(resultado.estadoFinal, resultado.exitosos, resultado.fallidos)}
                </span>
              </div>
              <div className="grid grid-cols-4 gap-3">
                <div className="card p-3"><p className="text-[11px] text-zinc-400">ID de procesamiento</p><p className="mono text-sm font-medium">{solicitud.idProcesoSP}</p></div>
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Autorizado por</p><p className="text-sm font-medium">{resultado.aprobadoPor}</p></div>
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Filas exitosas</p><p className="text-xl font-semibold text-green-600">{resultado.exitosos}</p></div>
                <div className="card p-3"><p className="text-[11px] text-zinc-400">Filas con error</p><p className="text-xl font-semibold text-orange-600">{resultado.fallidos}</p></div>
              </div>
              <div className="mt-3 rounded-lg bg-zinc-50 border border-zinc-200 px-4 py-3 flex items-center justify-between flex-wrap gap-3">
                <p className="s3-tag mono">Log de auditoría: s3://erp-precios-logs/{resultado.logS3Key.split("/")[1]}</p>
                <div className="flex items-center gap-2">
                  <button className="btn btn-outline" onClick={descargarLogAuditoria}><Icon name="download" className="w-3.5 h-3.5" /> Descargar Log (CSV)</button>
                  <button className="btn btn-outline" disabled={resultado.fallidos === 0} onClick={descargarSoloFallidas}><Icon name="refreshCw" className="w-3.5 h-3.5" /> Exportar errores (Excel)</button>
                </div>
              </div>
            </React.Fragment>
          )}

          {puedeDecidir && (
            <div className="border-t border-zinc-100 pt-4">
              <label className="block text-xs font-medium mb-1.5">Motivo de rechazo <span className="text-red-600">*</span></label>
              <textarea rows={2} value={motivo} onChange={function (e) { setMotivo(e.target.value); }} placeholder="Obligatorio si la decisión es rechazar la solicitud..." className="w-full text-sm px-3 py-2 rounded-lg border border-zinc-200 focus:outline-none focus:ring-2 focus:ring-zinc-900/10" />
            </div>
          )}
        </div>

        <div className="p-6 border-t border-zinc-100 flex items-center justify-end gap-2">
          {puedeDecidir ? (
            <React.Fragment>
              <button className="btn btn-outline text-red-600" disabled={motivo.trim().length === 0} onClick={function () { onRechazar(solicitud.id, motivo.trim()); onClose(); }}>Rechazar</button>
              <button className="btn btn-destructive" disabled={!puedeAprobar} title={!simulacionConfirmada ? "Primero simule el impacto con los parámetros del solicitante." : undefined} onClick={iniciarEjecucion}>Procesar Solicitud</button>
            </React.Fragment>
          ) : (
            <button className="btn btn-default" onClick={onClose}>{estaEnProceso ? "Continuar trabajando" : "Cerrar"}</button>
          )}
        </div>
      </div>
    </div>
  );
}

/* =========================================================================
   AUDITORÍA (log derivado de los cambios de estado)
   Traduce las claves técnicas de evento a lenguaje de negocio y muestra el
   resultado del control de estados del procesamiento en segundo plano: cuando
   la ejecución finaliza, la auditoría deja constancia explícita de si quedó
   OK / ejecutada completa, con errores parciales, o en error.
   ========================================================================= */
const EVENTOS_AUDITORIA = {
  SOLICITUD_ENVIADA: "Solicitud enviada a aprobación",
  SOLICITUD_RECHAZADA: "Solicitud rechazada",
  SIMULACION_REVISADA: "Simulación revisada por el aprobador",
  SIMULACION_EJECUTADA_COMO_SOLICITANTE: "Simulación verificada con los parámetros del solicitante",
  EJECUCION_ENCOLADA: "Ejecución autorizada y encolada",
  EJECUCION_FINALIZADA: "Procesamiento en segundo plano finalizado",
};

function etiquetaEvento(evento) {
  return EVENTOS_AUDITORIA[evento] || evento;
}

function textoResultadoAuditoria(estadoFinal, exitosos, fallidos) {
  const total = exitosos + fallidos;
  if (estadoFinal === "PROCESADO") return "OK · Ejecutado completo (" + exitosos + " de " + total + " registros)";
  if (estadoFinal === "PROCESADO_CON_ERRORES") return "Completado con errores (" + exitosos + " exitosos, " + fallidos + " con error de " + total + ")";
  return "Error de ejecución (0 de " + total + " registros aplicados)";
}

function Auditoria({ eventos }) {
  return (
    <div className="card overflow-hidden">
      <table className="w-full text-sm">
        <thead className="bg-zinc-50 text-xs text-zinc-500">
          <tr>
            <th className="text-left font-medium px-4 py-3">Fecha/Hora</th>
            <th className="text-left font-medium px-4 py-3">Usuario</th>
            <th className="text-left font-medium px-4 py-3">Rol</th>
            <th className="text-left font-medium px-4 py-3">Evento</th>
            <th className="text-left font-medium px-4 py-3">ID Solicitud</th>
            <th className="text-left font-medium px-4 py-3">ID de Proceso</th>
          </tr>
        </thead>
        <tbody className="divide-y divide-zinc-100">
          {eventos.length === 0 && (
            <tr><td colSpan={6} className="px-4 py-10 text-center text-zinc-400">Sin eventos registrados en esta sesión todavía.</td></tr>
          )}
          {eventos.map(function (e) {
            return (
              <tr key={e.id}>
                <td className="px-4 py-3 mono text-zinc-500">{e.fecha}</td>
                <td className="px-4 py-3">{e.usuario}</td>
                <td className="px-4 py-3"><span className="badge badge-outline">{e.rol}</span></td>
                <td className="px-4 py-3"><span className="badge badge-outline">{etiquetaEvento(e.evento)}</span></td>
                <td className="px-4 py-3 mono">{e.solicitudId || "—"}</td>
                <td className="px-4 py-3 mono">{e.idProcesoSP || "—"}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

  function pushToast(message, variant) {
    const id = Date.now() + Math.random();

    const nueva = {
      id: id,
      proceso: payload.proceso,
      modalidad: payload.modalidad,
      compania: payload.compania,
      solicitanteNombre: user.nombre,
      solicitanteEmail: user.email,
      parametros: payload.parametros,
      filas: payload.filas,
      archivoNombre: payload.archivoNombre,
      archivoS3Key: payload.archivoS3Key,
      fechaEnvio: now.toLocaleString("es-CR", { hour12: false }),
      estado: "PENDIENTE",
      motivoRechazo: null,
      idProcesoSP: null,
    };
    setSolicitudes(function (list) { return [nueva].concat(list); });
    registrarEvento("SOLICITUD_ENVIADA", { solicitudId: id });
    pushToast("Solicitud " + id + " enviada a aprobación · Estado: Pendiente de aprobación", "success");
  }

  function handleRechazar(id, motivo) {
    setSolicitudes(function (list) {
      return list.map(function (s) { return s.id === id ? Object.assign({}, s, { estado: "RECHAZADO", motivoRechazo: motivo }) : s; });
    });
    registrarEvento("SOLICITUD_RECHAZADA", { solicitudId: id });
    pushToast("Solicitud " + id + " rechazada. El solicitante fue notificado.", "error");
  }

  function handleAprobarInicio(id, filasProcesadas) {
    const idProcesoSP = nuevoIdProcesoSP();
    const now = new Date();
    const inicio = now.toLocaleString("es-CR", { hour12: false });
    setSolicitudes(function (list) {
      return list.map(function (s) {
        return s.id === id ? Object.assign({}, s, {
          estado: "EN_PROCESO",
          idProcesoSP: idProcesoSP,
          filas: filasProcesadas || s.filas,
          autorizadoPor: user.nombre,
          autorizadoPorEmail: user.email,
          ultimaActualizacion: inicio,
        }) : s;
      });
    });
    registrarEvento("EJECUCION_ENCOLADA", { solicitudId: id, idProcesoSP: idProcesoSP });
    pushToast("Solicitud " + id + " en proceso. Puede continuar trabajando; la solicitud se procesa en segundo plano.", "success");

    // Ejercicio práctico: representa al worker/backend que procesa una cola.
    // En producción, el navegador nunca ejecuta ni espera el procesamiento:
    // solo consulta GET /solicitudes/{id} o recibe una notificación de resultado.
    // El tiempo de espera se mantiene perceptible (no instantáneo) para que
    // el usuario y la auditoría puedan constatar el estado "En proceso".
    setTimeout(function () {
      setSolicitudes(function (list) {
        return list.map(function (s) {
          if (s.id !== id || s.estado !== "EN_PROCESO") return s;
          const filasFinales = s.filas || [];
          const fallidos = filasFinales.filter(function (f) { return !f.validacion.valido; }).length;
          const exitosos = filasFinales.length - fallidos;
          const estadoFinal = fallidos === 0 ? "PROCESADO" : (fallidos === filasFinales.length ? "ERROR_EJECUCION" : "PROCESADO_CON_ERRORES");
          const resultado = {
            totalLote: filasFinales.length,
            exitosos: exitosos,
            fallidos: fallidos,
            filas: filasFinales,
            estadoFinal: estadoFinal,
            logS3Key: "erp-precios-logs/" + nombreArchivoS3("log-auditoria-" + id, "csv"),
            aprobadoPor: s.autorizadoPor || user.nombre,
            aprobadoPorEmail: s.autorizadoPorEmail || user.email,
          };
          return Object.assign({}, s, {
            estado: estadoFinal,
            resultado: resultado,
            ultimaActualizacion: new Date().toLocaleString("es-CR", { hour12: false }),
          });
        });
      });
      registrarEvento("EJECUCION_FINALIZADA", { solicitudId: id, idProcesoSP: idProcesoSP });
      pushToast("El procesamiento " + idProcesoSP + " finalizó. Consulte el detalle de la solicitud.", "success");
    }, 15000);
  }

  const solicitudModal = solicitudes.find(function (s) { return s.id === modalId; });

  function abrirModal(id) {
    const solicitud = solicitudes.find(function (item) { return item.id === id; });
    if (!solicitud) return;
    const esPropia = solicitud.solicitanteEmail === user.email;
    // El solicitante siempre puede consultar el detalle de su propia solicitud
    // (aunque esté Pendiente, En proceso, etc.), solo en modo lectura. Un
    // Aprobador puede además abrir solicitudes ajenas dentro de su ámbito
    // para revisarlas o decidir; nunca puede aprobar su propia solicitud.
    const puedeConsultar = esPropia || (user.rol === "APROBADOR" && estaEnAmbito(user, solicitud.compania, null));
    if (!puedeConsultar) return;
    setModalId(id);
    if (solicitud.estado === "PENDIENTE" && user.rol === "APROBADOR" && !esPropia) {
      registrarEvento("SIMULACION_REVISADA", { solicitudId: id });
    }
  }

  const esAprobador = user.rol === "APROBADOR";
  const esOperador = user.rol === "OPERADOR";

  return (
    <div>
      <Header user={user} onChangeUser={setUser} onNav={setNav} activeNav={nav} />
      <Toaster toasts={toasts} />

      {user.rol === "SIN_PERMISO" ? (
        <Vista403 user={user} />
      ) : (
        <main className="max-w-7xl mx-auto px-6 py-8">
          {nav === "nueva" && (
            <div>
              <div className="mb-5">
                <h1 className="text-2xl font-semibold">Nueva solicitud de cambio de precio</h1>
              </div>
              <NuevaSolicitud readOnly={false} currentUser={user} onSubmit={handleNuevaSolicitud} />
              <MisSolicitudes solicitudes={solicitudes} currentUser={user} onVerDetalle={abrirModal} />
            </div>
          )}

          {nav === "bandeja" && (
            <div>
              <div className="mb-5">
                <h1 className="text-2xl font-semibold">Bandeja de aprobación</h1>
                <p className="text-sm text-zinc-500 mt-1">Solicitudes dentro de su ámbito. No puede aprobar solicitudes creadas por usted mismo.</p>
              </div>
              <BandejaAprobacion solicitudes={solicitudes} currentUser={user} readOnly={!esAprobador} onAbrir={abrirModal} />
            </div>
          )}

          {nav === "auditoria" && (
            <div>
              <div className="mb-5">
                <h1 className="text-2xl font-semibold">Auditoría y Logs</h1>
                <p className="text-sm text-zinc-500 mt-1">Historial de eventos generados durante esta sesión de simulación.</p>
              </div>
              <Auditoria eventos={eventos} />
            </div>
          )}
        </main>
      )}

      {solicitudModal && (
        <RevisionModal
          solicitud={solicitudModal}
          currentUser={user}
          onClose={function () { setModalId(null); }}
          onRechazar={handleRechazar}
          onIniciarEjecucion={handleAprobarInicio}
          onSimularSolicitud={function (id) {
            registrarEvento("SIMULACION_EJECUTADA_COMO_SOLICITANTE", { solicitudId: id });
            pushToast("Simulación de " + id + " completada con los parámetros del solicitante.", "success");
          }}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
